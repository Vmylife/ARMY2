   return cpuPaintTriangles(tris,{x:0,y:0,w:cpuCanvas.width,h:cpuCanvas.height});
 }
 function cpuSpriteFor(p){
   const tris=cpuTriangleList([p]);if(!tris.length)return null;
   let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
   for(const tri of tris)for(const [x,y] of tri.pts){minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y)}
   minX=Math.floor(minX)-2;minY=Math.floor(minY)-2;maxX=Math.ceil(maxX)+2;maxY=Math.ceil(maxY)+2;
   return {sprite:cpuPaintTriangles(tris,{x:minX,y:minY,w:maxX-minX,h:maxY-minY}),x:minX,y:minY};
 }
 function cpuEnsureIntact(){readyImage(type)}
 function cpuEnsureSprites(){
   const info=cache[type];if(info&&!info.cpuSprites)info.cpuSprites=parts.map(p=>cpuSpriteFor(p));
 }
 function switchToCpu(reason){
   if(cpuMode)return;
   cpuMode=true;canvas.style.display='none';cpuCanvas.style.display='block';
   const info=cache[type];if(!info)return;
   status.textContent=`${names[type]}：${parts.length} 塊。使用原始模型深度貼圖相容模式。`;
   try{cpuEnsureIntact();if(state==='falling')cpuEnsureSprites()}
   catch(e){console.error('相容繪製失敗',e);status.textContent='相容繪製失敗：'+e.message;}
 }
 function cpuDraw(t){
   const w=cpuCanvas.width,h=cpuCanvas.height,c=cpuCtx;
   c.fillStyle='#aec7a7';c.fillRect(0,0,w,h);
   const origin=cpuProject(0,0,0);
   c.fillStyle='#78946e';c.beginPath();for(const a of [[-13,0,-13],[13,0,-13],[13,0,13],[-13,0,13]]){const q=cpuProject(...a);if(a[0]===-13&&a[2]===-13)c.moveTo(...q);else c.lineTo(...q);}c.closePath();c.fill();
   c.strokeStyle='rgba(232,229,162,.30)';c.lineWidth=2;
   for(let x=-11;x<=11;x+=3){let a=cpuProject(x,0,-10),b=cpuProject(x,0,10);c.beginPath();c.moveTo(...a);c.lineTo(...b);c.stroke()}
   for(let z=-10;z<=10;z+=3){let a=cpuProject(-11,0,z),b=cpuProject(11,0,z);c.beginPath();c.moveTo(...a);c.lineTo(...b);c.stroke()}
   const k=Math.min(w/13,h/12.8);
   c.fillStyle='#253b2d66';c.beginPath();c.ellipse(origin[0],origin[1]+k*.8,3.8*k,1.55*k,-.2,0,Math.PI*2);c.fill();
   const info=cache[type];
   if(info){
     if(state==='falling'&&impact?.hit){
       cpuEnsureSprites();
       const ord=parts.map((p,i)=>({p,i,depth:p.world[0]*.64+p.world[1]*.40+p.world[2]*.77})).sort((a,b)=>a.depth-b.depth);
       for(const {p,i} of ord){const sp=info.cpuSprites[i];if(!sp)continue;
         const o=cpuProject(p.offset[0],p.offset[1],p.offset[2]),d=origin;
         c.save();c.translate(sp.x+sp.sprite.width/2+o[0]-d[0],sp.y+sp.sprite.height/2+o[1]-d[1]);
         c.rotate(p.spin[0]*.28+p.spin[1]*.25);c.drawImage(sp.sprite,-sp.sprite.width/2,-sp.sprite.height/2);c.restore();}
     }else{
       const img=readyImage(type);
       if(img.complete&&img.naturalWidth){
         // Pre-render uses W=1000, H=700, projection scale 700/12.8.
         // Keep the projection size/location identical on portrait and landscape.
         const unit=Math.min(w/13,h/12.8)/(700/12.8);
         c.drawImage(img,w*.5-500*unit,h*.53-700*.53*unit,1000*unit,700*unit);
       }else{
         // Visible loading indication instead of the previous broken UV triangle painter.
         c.fillStyle='#e1e9d2';c.textAlign='center';c.font='bold 20px system-ui';
         c.fillText('正在還原原始建築貼圖…',w*.5,h*.51);
       }
     }
   }
   if(grenade?.xyz){const [x,y]=cpuProject(...grenade.xyz);c.beginPath();c.arc(x,y,8,0,Math.PI*2);c.fillStyle='#374a30';c.fill();c.strokeStyle='#dae6ae';c.lineWidth=2;c.stroke();}
   if(impact&&impact.t<.6){const p=cpuProject(...impact.pos);c.beginPath();c.arc(p[0],p[1],Math.max(8,impact.t*185),0,Math.PI*2);c.strokeStyle=`rgba(255,235,138,${Math.max(0,1-impact.t/.6)})`;c.lineWidth=Math.max(2,11-impact.t*12);c.stroke();}
 }

 function drawMesh(geo,tex,model,tint){gl.uniformMatrix4fv(U.model,false,model);gl.uniform3fv(U.tint,tint);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.bindVertexArray(geo.vao);gl.drawElements(gl.TRIANGLES,geo.count,geo.indexType,0)}
 function frame(t){requestAnimationFrame(frame);const now=t/1000,dt=Math.min((now-(frame.last||now)),.045);frame.last=now;
 const dpr=Math.min(window.devicePixelRatio||1,1.65),w=Math.round((cpuMode?cpuCanvas:canvas).clientWidth*dpr),h=Math.round((cpuMode?cpuCanvas:canvas).clientHeight*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}if(cpuCanvas.width!==w||cpuCanvas.height!==h){cpuCanvas.width=w;cpuCanvas.height=h;if(cpuMode&&cache[type]){cache[type].cpuIntact=null;cache[type].cpuSprites=null;cpuEnsureIntact();}}if(!cpuMode){gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);gl.clearColor(.67,.78,.66,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);}
 if(state==='flying'){grenade.t+=dt;const g=grenade,a=clamp(g.t/g.duration,0,1);g.xyz=[g.start[0]+(g.end[0]-g.start[0])*a,g.start[1]+(g.end[1]-g.start[1])*a+4.9*4*a*(1-a),g.start[2]+(g.end[2]-g.start[2])*a];if(a>=1){const bounds=cache[type]?.bounds;const halfX=((bounds.hi[0]-bounds.lo[0])*scaleUnit)/2,halfZ=((bounds.hi[2]-bounds.lo[2])*scaleUnit)/2;const cx=0,cz=0;const hit=Math.abs(g.end[0]-cx)<=halfX+.30&&Math.abs(g.end[2]-cz)<=halfZ+.30;setExplosion(hit)}}
 if(state==='falling'&&impact){impact.t+=dt;if(impact.hit)for(const p of parts){for(let i=0;i<3;i++){p.offset[i]+=p.velocity[i]*dt;p.spin[i]+=p.omega[i]*dt; p.omega[i]*=1-dt*.63;}p.velocity[1]-=15*dt;const bottom=p.world[1]+p.offset[1]+p.worldBottom;if(bottom<.05){p.offset[1]+=.05-bottom;p.velocity[1]=Math.abs(p.velocity[1])*.31;if(p.velocity[1]<.5)p.velocity[1]=0;p.velocity[0]*=.92;p.velocity[2]*=.92}}}
 if(cpuMode){cpuDraw(t);return;}
 const ratio=w/h,portrait=ratio<.86,cam=[12.5,portrait?12.8:10.1,portrait?19.5:15.2],vp=mul(perspective(portrait?Math.PI/3.6:Math.PI/3.8,ratio,.1,100),view(cam,[0,buildingHeight*.37,0]));gl.useProgram(pr);gl.uniformMatrix4fv(U.vp,false,vp);gl.uniform1i(U.tex,0);
 drawMesh(sheet,white,mul(tr(0,-.06,0),scale(1,1,1)),[.44,.60,.39]);
 // visual training range: ground markings and sandbag-color boxes
 for(let i=-3;i<=3;i++){drawMesh(cube,white,mul(tr(i*2.8,-.04,-5.5),scale(.07,.04,.07)),[.68,.71,.38])}
 const info=cache[type];if(info){for(const p of parts){const world=p.world;const model=mul(tr(world[0]+p.offset[0],world[1]+p.offset[1],world[2]+p.offset[2]),mul(rotate(...p.spin),scale(scaleUnit,scaleUnit,scaleUnit)));drawMesh(p.geo,info.texture,model,[1,1,1]);}}
 if(grenade?.xyz){const g=grenade.xyz;drawMesh(cube,white,mul(tr(...g),mul(rotate(now*6,now*4,now*3),scale(.15,.16,.15))),[.19,.36,.18]);}
 if(impact&&impact.t<.6){const r=impact.t*5.7;drawMesh(cube,white,mul(tr(impact.pos[0],.03,impact.pos[2]),scale(r,.015,r)),[.96,.72,.23]);}
 gl.bindVertexArray(null);
 if(state==='ready'&&!cpuMode&&++probeFrames>=10){
   probeFrames=0;
   const x0=Math.floor(w*.27),y0=Math.floor(h*.27),pw=Math.max(2,Math.floor(w*.46)),ph=Math.max(2,Math.floor(h*.48));
   const pix=new Uint8Array(pw*ph*4);
   gl.readPixels(x0,y0,pw,ph,gl.RGBA,gl.UNSIGNED_BYTE,pix);
   let dark=0,light=0,patches=0;
   for(let i=0;i<pix.length;i+=28){const r=pix[i],g=pix[i+1],b=pix[i+2];if(r<115||g<126||b<110)dark++;if(r>200||g>220||b>205)light++;patches++;}
   const err=gl.getError();
   // Buildings have broad dark/light color contrast; the green ground doesn't.
   if(err!==gl.NO_ERROR || (dark+light)<patches*.007) switchToCpu(err!==gl.NO_ERROR?'webgl error '+err:'no building pixels');
 }
 }
 canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();switchToCpu('webgl context lost')});
 window.addEventListener('error',e=>{if(cache[type]&&!cpuMode)switchToCpu('render exception')});
 window.__destructionDebug=()=>({type,state,pieces:parts.length,shattered:state==='falling',modelLoaded:!!cache[type],mode,renderWidth:canvas.width,renderer:cpuMode?'depth-correct-image+dynamic-canvas':'webgl2'});
 requestAnimationFrame(frame);choose('barracks').then(()=>{if(new URLSearchParams(location.search).has('compat'))switchToCpu('manual compatibility');});
})();
</script></body></html>
