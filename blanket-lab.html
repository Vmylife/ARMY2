<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#19251d">
<title>豆腐干棉被｜自由厚棉被試玩 v0.3</title>
<style>
  :root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#19251d;overscroll-behavior:none}
  canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas.grabbing{cursor:grabbing}
  .top{position:absolute;left:0;right:0;top:0;padding:calc(18px + env(safe-area-inset-top)) 22px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:14px}
  .heading{color:#f3f1dc;text-shadow:0 1px 10px #1019118c}
  h1{margin:0 0 5px;font-size:clamp(19px,3vw,26px);font-weight:800;letter-spacing:1.8px}
  .heading small{color:#c6cfb9;font-size:12px;letter-spacing:.5px}
  button{pointer-events:auto;font:inherit;border:1px solid #a7b8a46b;background:#354636df;color:#f2f5e5;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;min-height:42px;touch-action:manipulation}
  button:active{transform:scale(.96)}
  .bottom{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:12px 12px calc(22px + env(safe-area-inset-bottom));pointer-events:none}
  .tips{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;max-width:95%;padding:11px 16px;background:#121c18c7;border:1px solid #98ac9680;border-radius:15px;box-shadow:0 8px 22px #0d160e70;color:#e1e7d7;font-size:12px}
  .tips span+span:before{content:'·';margin-right:9px;color:#98b393}
  .status{position:absolute;left:50%;bottom:94px;transform:translateX(-50%);pointer-events:none;white-space:nowrap;color:#f0eacc;background:#19251ad0;padding:7px 11px;border-radius:20px;font-size:12px;transition:opacity .25s;opacity:0}
  .status.show{opacity:1}
  @media(max-width:420px){.top{padding-left:15px;padding-right:15px} .tips{font-size:11px;gap:5px;padding:10px 9px}.tips span+span:before{margin-right:5px}.status{bottom:112px}}
</style>
</head>
<body>
<canvas id="scene" aria-label="可自由抓取任一角或布面並任意摺疊、拖下平台的軟棉被"></canvas>
<div class="top"><div class="heading"><h1>豆腐干棉被</h1><small>稍微厚一點的軟被子，想怎麼折都可以</small></div><button id="reset" type="button">重新攤開</button></div>
<div class="status" id="status" role="status" aria-live="polite"></div>
<div class="bottom"><div class="tips"><span>抓角落拉起</span><span>長按被面抓布</span><span>輕滑推整</span><span>拖下床會掉落</span></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false});
const status=document.getElementById('status');
// Standalone Verlet fabric: every corner is a DIFFERENT free-moving particle.
// No fold axis, mirrored corner, auto snapping, tabletop clamp, or canned poses.
const NX=25,NZ=19,BW=2.18,BD=1.62;
// Light quilt fill, not a thick mattress: about 6.5cm edge, physical folded-layer spacing.
const QUILT_THICKNESS=.065;
const TABLE={xmin:-1.245,xmax:1.245,zmin:-.96,zmax:.96};
const FLOOR=-.94,TOP=.054,H=1/60;
const particles=[],springs=[],quads=[],edge=[];
let width=innerWidth,height=innerHeight,scale=120,cx=0,cy=0,last=performance.now(),lag=0,drag=null;
let showHelp=true,statusUntil=0,clock=0,canvasScale=1,frames=0;
const clamp=(a,b,c)=>Math.min(c,Math.max(b,a));
const sq=(x)=>x*x,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);
const at=(i,j)=>j*NX+i;
const P=(x,z,y=0)=>({x:cx+scale*(x+z*.22),y:cy+scale*(z*.73-y*.91)});
const ground=(x,y,atHeight=TOP)=>{const A=(x-cx)/scale,B=(y-cy)/scale + .91*atHeight;return {x:A-(B/.73)*.22,z:B/.73};};
const vlen=(p,q)=>Math.hypot(p.x-q.x,p.y-q.y);
function notify(s){status.textContent=s;status.classList.add('show');statusUntil=performance.now()+1500;}
function connect(a,b,stiff){springs.push({a,b,rest:dist(particles[a],particles[b]),stiff});}
function reset(){
 particles.length=0;springs.length=0;quads.length=0;edge.length=0;
 drag=null;showHelp=true;clock=0;frames=0;
 const phase=Math.random()*Math.PI*2;
 for(let j=0;j<NZ;j++)for(let i=0;i<NX;i++){
  const u=i/(NX-1),v=j/(NZ-1);
  const ripple=.018*Math.sin(i*.53+j*.29+phase)+.012*Math.cos(i*.30-j*.46);
  // A few gently stuffed quilt sections, without a flat rigid sheet surface.
  const puff=.012*Math.sin(u*Math.PI*5)**2*Math.sin(v*Math.PI*4)**2;
  const x=(u-.5)*BW+.012*Math.sin(v*11+phase),z=(v-.5)*BD+.014*Math.sin(u*9+phase),y=TOP+.038+ripple+puff;
  particles.push({id:at(i,j),i,j,x,y,z,px:x,py:y,pz:z,shade:Math.sin(i*1.51+j*.83)});
 }
 for(let j=0;j<NZ;j++)for(let i=0;i<NX;i++){
  if(i<NX-1)connect(at(i,j),at(i+1,j),.78);
  if(j<NZ-1)connect(at(i,j),at(i,j+1),.78);
  if(i<NX-1&&j<NZ-1){connect(at(i,j),at(i+1,j+1),.28);connect(at(i+1,j),at(i,j+1),.28);}
  if(i<NX-2)connect(at(i,j),at(i+2,j),.10);
  if(j<NZ-2)connect(at(i,j),at(i,j+2),.10);
  if(i<NX-1&&j<NZ-1)quads.push([at(i,j),at(i+1,j),at(i+1,j+1),at(i,j+1)]);
 }
 for(let i=0;i<NX;i++)edge.push(at(i,0));
 for(let j=1;j<NZ;j++)edge.push(at(NX-1,j));
 for(let i=NX-2;i>=0;i--)edge.push(at(i,NZ-1));
 for(let j=NZ-2;j>0;j--)edge.push(at(0,j));
 canvas.classList.remove('grabbing');
}
function resize(){
 width=innerWidth;height=innerHeight;canvasScale=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(width*canvasScale);canvas.height=Math.round(height*canvasScale);
 canvas.style.width=width+'px';canvas.style.height=height+'px';
 ctx.setTransform(canvasScale,0,0,canvasScale,0,0);
 scale=Math.max(76,Math.min(width/3.02,(height-155)/2.56,270));
 cx=width*.50;cy=height*.52;
}
function polygon(a,fill){if(a.length<3)return;ctx.beginPath();ctx.moveTo(a[0].x,a[0].y);for(let k=1;k<a.length;k++)ctx.lineTo(a[k].x,a[k].y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();}
function outline(a){ctx.beginPath();ctx.moveTo(a[0].x,a[0].y);for(let k=1;k<a.length;k++)ctx.lineTo(a[k].x,a[k].y);ctx.closePath();}
const rect=(x,z,X,Z,y)=>[P(x,z,y),P(X,z,y),P(X,Z,y),P(x,Z,y)];
function drawRoom(){
 const bg=ctx.createLinearGradient(0,0,width,height);bg.addColorStop(0,'#26392e');bg.addColorStop(.65,'#1b2d23');bg.addColorStop(1,'#101d19');ctx.fillStyle=bg;ctx.fillRect(0,0,width,height);
 ctx.save();ctx.strokeStyle='#bccfb015';ctx.lineWidth=1;
 for(let x=-width;x<width*2;x+=scale*1.55){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x-width*.17,height);ctx.stroke();}
 for(let y=-100;y<height+200;y+=scale*.95){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(width,y-width*.03);ctx.stroke();}ctx.restore();
 // The mattress is a real height boundary to the physics; outside it the cloth falls.
 const shadow=rect(-1.30,-1.03,1.30,1.05,-.36).map(q=>({x:q.x+12,y:q.y+17}));
 ctx.save();ctx.shadowColor='#07150dbd';ctx.shadowBlur=24;polygon(shadow,'#10201674');ctx.restore();
 const top=rect(-1.27,-1,1.27,1,0);
 polygon([top[3],top[2],{x:top[2].x,y:top[2].y+31},{x:top[3].x,y:top[3].y+31}],'#51594a');
 polygon([top[1],top[2],{x:top[2].x,y:top[2].y+31},{x:top[1].x,y:top[1].y+31}],'#384539');
 polygon(top,'#a3ac9d');polygon(rect(-1.23,-.955,1.23,.955,.012),'#b0b8a8');
 ctx.save();outline(rect(-1.22,-.945,1.22,.945,.012));ctx.closePath();ctx.strokeStyle='#d7dcc7c0';ctx.lineWidth=1.4;ctx.stroke();ctx.restore();
}
// Projection hit test: resolve ALL overlapping faces; choose visible upper layer.
function bary(pt,a,b,c){const det=(b.y-c.y)*(a.x-c.x)+(c.x-b.x)*(a.y-c.y);if(Math.abs(det)<.0001)return null;
 const w1=((b.y-c.y)*(pt.x-c.x)+(c.x-b.x)*(pt.y-c.y))/det;
 const w2=((c.y-a.y)*(pt.x-c.x)+(a.x-c.x)*(pt.y-c.y))/det,w3=1-w1-w2;
 return w1>=-.015&&w2>=-.015&&w3>=-.015?[w1,w2,w3]:null;
}
function findPoint(pos){
 // Prefer exact nearby boundary nodes so grabbing one corner never grabs the opposite corner.
 let corner=null,dd=Infinity;
 for(const id of [at(0,0),at(NX-1,0),at(NX-1,NZ-1),at(0,NZ-1)]){
  const q=P(particles[id].x,particles[id].z,particles[id].y),d=vlen(q,pos);
  if(d<dd){dd=d;corner=id;}
 }
 if(dd<Math.max(25,scale*.15))return {id:corner,corner:true};
 let best=null,high=-Infinity;
 for(const face of quads){
  const p=face.map(id=>particles[id]),p2=p.map(q=>P(q.x,q.z,q.y));
  for(const tri of [[0,1,2],[0,2,3]]){
   const w=bary(pos,p2[tri[0]],p2[tri[1]],p2[tri[2]]);if(!w)continue;
   const y=w.reduce((v,r,k)=>v+r*p[tri[k]].y,0);
   if(y>high){let near=tri[0];for(const m of tri)if(vlen(p2[m],pos)<vlen(p2[near],pos))near=m;best=face[near];high=y;}
  }
 }
 return best===null?null:{id:best,corner:false};
}
function capTarget(g){
 // Finger motion shifts the grabbed point freely in XY on the table and above it.
 // Dragging toward the top of the screen lifts the fold; gravity remains active everywhere else.
 const deltaX=(g.cur.x-g.start.x)/scale,deltaY=(g.cur.y-g.start.y)/scale;
 // Finger displacement acts on ONLY the held particle. Keep height under
 // control; the previous unrestricted 2.3m lift turned cloth into a tall flag.
 const freeX=g.origin.x+deltaX-deltaY*.20;
 const freeZ=g.origin.z+deltaY/.76;
 const amount=Math.hypot(deltaX,deltaY);
 const lift=.035+Math.min(.64,amount*.43)+Math.max(0,-deltaY)*.06;
 g.goal={x:clamp(freeX,-3.0,3.0),y:clamp(g.origin.y+lift,-.4,.84),z:clamp(freeZ,-2.55,2.55)};
}
function movePin(g){
 if(!g||g.mode!=='hold')return;
 capTarget(g);
 const p=particles[g.id];
 // Slight grip inertia is crucial: a real corner drags the surrounding material behind it.
 const rate=.26;
 p.x+=(g.goal.x-p.x)*rate;p.y+=(g.goal.y-p.y)*rate;p.z+=(g.goal.z-p.z)*rate;
 p.px=p.x;p.py=p.y;p.pz=p.z;
}
function constraints(){
 for(const s of springs){const a=particles[s.a],b=particles[s.b],dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z;
  const len=Math.hypot(dx,dy,dz)||.000001;
  // Soft compression, strong tensile limit. The blanket can bunch and collapse.
  let stretch=len-s.rest;
  // Real filled cloth cannot collapse to zero area like a string. Maintain
  // moderate compression resistance but allow folds to stack in 3-D.
  if(stretch<0)stretch*=.23;
  const amt=(stretch/len)*s.stiff*.50;
  const gx=dx*amt,gy=dy*amt,gz=dz*amt;
  const af=drag&&drag.mode==='hold'&&drag.id===a.id?0:1,bf=drag&&drag.mode==='hold'&&drag.id===b.id?0:1;
  const sum=af+bf;if(!sum)continue;
  a.x+=gx*af*2/sum;a.y+=gy*af*2/sum;a.z+=gz*af*2/sum;
  b.x-=gx*bf*2/sum;b.y-=gy*bf*2/sum;b.z-=gz*bf*2/sum;
 }
}
function collision(){
 for(const p of particles){
  if(drag&&drag.mode==='hold'&&drag.id===p.id)continue;
  const onBed=p.x>TABLE.xmin&&p.x<TABLE.xmax&&p.z>TABLE.zmin&&p.z<TABLE.zmax;
  const foot=onBed?TOP:FLOOR;
  if(p.y<foot){p.y=foot;
   // Friction without pinning: an ungripped corner can be pulled all the way over the edge.
   p.px+=(p.x-p.px)*.88;p.pz+=(p.z-p.pz)*.88;
   p.py=p.y+(p.y-p.py)*.07;
  }
  if(p.y>3)p.y=3;
 }
}
// Nearby non-neighbour material has a thin thickness; prevents folded fabric from
// collapsing into a single invisible surface without imposing canned fold lines.
function selfCollision(){
 const cell=.105,hash=new Map();
 for(const p of particles){const k=Math.floor(p.x/cell)+','+Math.floor(p.z/cell);let a=hash.get(k);if(!a)hash.set(k,a=[]);a.push(p);}
 for(const p of particles){
  const x=Math.floor(p.x/cell),z=Math.floor(p.z/cell);
  for(let xx=x-1;xx<=x+1;xx++)for(let zz=z-1;zz<=z+1;zz++){
   const a=hash.get(xx+','+zz);if(!a)continue;
   for(const q of a){if(q.id<=p.id||Math.abs(p.i-q.i)<3&&Math.abs(p.j-q.j)<3)continue;
    const dx=q.x-p.x,dz=q.z-p.z,planar=Math.hypot(dx,dz);
    if(planar>.070||Math.abs(p.y-q.y)>QUILT_THICKNESS*1.3)continue;
    const delta=QUILT_THICKNESS*1.08-Math.abs(p.y-q.y);
    if(delta<=0)continue;
    const sign=p.y<=q.y?-1:1;
    const pinP=drag&&drag.mode==='hold'&&drag.id===p.id,pinQ=drag&&drag.mode==='hold'&&drag.id===q.id;
    // Previous-frame positions must move too, or repeated layer separation
    // becomes perpetual upward acceleration (the spiky umbrella bug).
    const shift=delta*.27;
    if(!pinP){p.y+=sign*shift;p.py+=sign*shift;}
    if(!pinQ){q.y-=sign*shift;q.py-=sign*shift;}
   }
  }
 }
}
function tick(dt){
 const damp=Math.pow(.936,dt*60);
 for(const p of particles){
  if(drag&&drag.mode==='hold'&&drag.id===p.id)continue;
  // Collision and rapid drags must not inject unlimited velocity into Verlet.
  // Without a speed limit the whole quilt degenerates into a vertical spike.
  const vx=clamp((p.x-p.px)*damp,-.042,.042),
        vy=clamp((p.y-p.py)*damp,-.072,.055),
        vz=clamp((p.z-p.pz)*damp,-.042,.042);
  p.px=p.x;p.py=p.y;p.pz=p.z;
  p.x+=vx;p.y+=vy-7.3*dt*dt;p.z+=vz;
 }
 // Quick stroking nudges nearby cloth; long press physically pins only ONE point.
 if(drag&&drag.mode==='brush'&&drag.moved){
  const p=particles[drag.id],radius=.27,dx=drag.brushDX,dz=drag.brushDZ;
  for(const n of particles){const distance=Math.hypot(n.x-p.x,n.z-p.z),w=Math.exp(-sq(distance/radius));
   n.x+=dx*w*.26;n.z+=dz*w*.26;
  }
  drag.brushDX=0;drag.brushDZ=0;
 }
 movePin(drag);
 for(let i=0;i<5;i++){
  constraints();
  if(i===2||i===4)selfCollision();
  collision();movePin(drag);
 }
}
function clothSides(front){
 // A soft quilt has a visible stuffed edge rather than the zero-thickness edge of a sheet.
 // Off-platform edges hang with the particles; they are NEVER snapped to the mattress.
 const thickness=QUILT_THICKNESS;
 for(let k=0;k<edge.length;k++){
  const a=particles[edge[k]],b=particles[edge[(k+1)%edge.length]];
  const isFront=(a.z+b.z)*.5>-.03;
  if(isFront!==front)continue;
  const downA=P(a.x,a.z,a.y-thickness),downB=P(b.x,b.z,b.y-thickness);
  const upA=P(a.x,a.z,a.y),upB=P(b.x,b.z,b.y);
  polygon([upA,upB,downB,downA],front?'#39563c':'#4a6849');
 }
}
function drawCloth(){
 clothSides(false);
 // Sort the surface quads by near/far, then height: overlapping folds reveal their actual layers.
 const ordered=quads.map((quad,n)=>({quad,n,z:quad.reduce((v,i)=>v+particles[i].z,0)/4,
  y:quad.reduce((v,i)=>v+particles[i].y,0)/4}));
 ordered.sort((a,b)=>a.z-b.z||(a.y-b.y));
 for(const f of ordered){
  const a=f.quad.map(i=>particles[i]),pp=a.map(q=>P(q.x,q.z,q.y));
  const gradient=(a[1].y+a[2].y-a[0].y-a[3].y)*.55;
  const slope=(a[2].y+a[3].y-a[0].y-a[1].y)*.54;
  const light=clamp(48+gradient*135-slope*85+Math.sin(f.n*.27)*.55,40,59);
  polygon(pp,`hsl(${99+f.n%4} 25% ${light}%)`);
  if(f.n%8===0){ctx.save();ctx.beginPath();ctx.moveTo((pp[0].x+pp[3].x)*.5,(pp[0].y+pp[3].y)*.5);
   ctx.lineTo((pp[1].x+pp[2].x)*.5,(pp[1].y+pp[2].y)*.5);ctx.strokeStyle='#e0e4c318';ctx.lineWidth=.65;ctx.stroke();ctx.restore();}
 }
 clothSides(true);
 // Draw independent hem segments instead of a single self-crossing outline:
 // a fully crumpled quilt used to produce ugly black rings and zigzag artifacts.
 ctx.save();ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle='#375039b0';ctx.lineWidth=1.35;
 for(let k=0;k<edge.length;k++){
  const a=particles[edge[k]],b=particles[edge[(k+1)%edge.length]];
  const q=P(a.x,a.z,a.y),r=P(b.x,b.z,b.y);
  ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(r.x,r.y);ctx.stroke();
 }
 ctx.strokeStyle='#cad8aa55';ctx.lineWidth=.65;
 for(let k=0;k<edge.length;k+=2){
  const a=particles[edge[k]],b=particles[edge[(k+1)%edge.length]],q=P(a.x,a.z,a.y),r=P(b.x,b.z,b.y);
  ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(r.x,r.y);ctx.stroke();
 }
 ctx.restore();
 ctx.save();ctx.strokeStyle='#d7ebbf12';ctx.lineWidth=.7;
 for(let j=5;j<NZ;j+=6){const a=[];for(let i=0;i<NX;i++)a.push(P(particles[at(i,j)].x,particles[at(i,j)].z,particles[at(i,j)].y));outline(a);ctx.stroke();}ctx.restore();
}
function drawGrab(){
 if(!drag){if(!showHelp)return;for(const id of [at(0,0),at(NX-1,0),at(NX-1,NZ-1),at(0,NZ-1)]){
  const p=particles[id],s=P(p.x,p.z,p.y),radius=Math.max(5,scale*.045);
  ctx.beginPath();ctx.arc(s.x,s.y,radius,0,Math.PI*2);ctx.fillStyle='#e6d69ac0';ctx.fill();ctx.strokeStyle='#fff4c7';ctx.lineWidth=1.25;ctx.stroke();
 }return;}
 const p=particles[drag.id],q=P(p.x,p.z,p.y);
 ctx.beginPath();ctx.arc(q.x,q.y,9,0,Math.PI*2);ctx.strokeStyle='#fff2b8ec';ctx.lineWidth=2.4;ctx.stroke();
 ctx.beginPath();ctx.arc(drag.cur.x,drag.cur.y,13,0,Math.PI*2);ctx.strokeStyle='#f8ebae90';ctx.lineWidth=1.5;ctx.stroke();
}
function frame(time){
 let elapsed=clamp((time-last)/1000,0,.055);last=time;
 lag=Math.min(lag+elapsed,H*3);clock+=elapsed;
 let count=0;while(lag>=H&&count++<3){tick(H);lag-=H;}
 ctx.clearRect(0,0,width,height);drawRoom();drawCloth();drawGrab();
 if(statusUntil&&time>statusUntil){statusUntil=0;status.classList.remove('show');}
 requestAnimationFrame(frame);
}
function down(e){if(drag||!e.isPrimary)return;
 const pos={x:e.clientX,y:e.clientY},hit=findPoint(pos);if(!hit)return;
 const p=particles[hit.id];
 drag={id:hit.id,origin:{x:p.x,y:p.y,z:p.z},start:pos,cur:pos,last:pos,
  since:performance.now(),moved:false,mode:hit.corner?'hold':'pending',brushDX:0,brushDZ:0};
 canvas.setPointerCapture(e.pointerId);drag.pointer=e.pointerId;
 canvas.classList.add('grabbing');showHelp=false;e.preventDefault();
}
function move(e){const g=drag;if(!g||g.pointer!==e.pointerId)return;
 const pos={x:e.clientX,y:e.clientY};g.cur=pos;
 const travel=vlen(pos,g.start);if(travel>4)g.moved=true;
 if(g.mode==='pending'){
  const duration=performance.now()-g.since;
  if(duration>=165){g.mode='hold';g.origin={x:particles[g.id].x,y:particles[g.id].y,z:particles[g.id].z};g.start={...pos};}
  else if(travel>12)g.mode='brush';
 }
 if(g.mode==='brush'){
  const ddx=(pos.x-g.last.x)/scale,ddy=(pos.y-g.last.y)/scale;
  g.brushDX+=clamp(ddx-ddy*.22,-.11,.11);g.brushDZ+=clamp(ddy/.73,-.11,.11);
 }
 g.last=pos;e.preventDefault();
}
function up(e){if(!drag||drag.pointer!==e.pointerId)return;
 if(drag.mode==='pending'&&!drag.moved){const p=particles[drag.id];p.py-=.05;}
 drag=null;canvas.classList.remove('grabbing');e.preventDefault();
}
canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('resize',resize,{passive:true});
document.getElementById('reset').addEventListener('click',()=>{reset();notify('重新攤開了');});
window.__blanketDebug=()=>({
  simulation:'free-mesh',nodes:particles.length,grabMode:drag?.mode||null,
  heldNode:drag?.id??null,clipped:false,
  corners:[at(0,0),at(NX-1,0),at(NX-1,NZ-1),at(0,NZ-1)].map(id=>{const p=particles[id];return {world:{x:p.x,y:p.y,z:p.z},screen:P(p.x,p.z,p.y)};}),
  offBed:particles.filter(p=>p.x<TABLE.xmin||p.x>TABLE.xmax||p.z<TABLE.zmin||p.z>TABLE.zmax).length,
  fallen:particles.filter(p=>p.y<-.5).length,
  center:particles[at(12,9)],
  bounds:particles.reduce((a,p)=>({minX:Math.min(a.minX,p.x),maxX:Math.max(a.maxX,p.x),minY:Math.min(a.minY,p.y),maxY:Math.max(a.maxY,p.y),minZ:Math.min(a.minZ,p.z),maxZ:Math.max(a.maxZ,p.z)}),{minX:99,maxX:-99,minY:99,maxY:-99,minZ:99,maxZ:-99})
});
reset();resize();requestAnimationFrame(frame);
})();
</script>
</body>
