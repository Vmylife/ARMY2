<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>軍營場景編輯器｜Army v0.11.16</title>
<link rel="stylesheet" href="./editor.css?v=0102">
<script type="importmap">{"imports":{"./src/map/campGeometry.js?v=092":"./src/map/ground103.js?v=124","./src/map/roadMesh.js?v=071":"./src/map/roadMesh104.js?v=123"}}</script>
</head>
<body>
<canvas id="scene" aria-label="軍營 3D 編輯視窗"></canvas>
<canvas id="overlay" aria-hidden="true"></canvas>
<div id="loading" role="status">準備軍營編輯器…</div>
<header class="topbar">
  <div><strong>軍營編輯器</strong><small>Army v0.11.16 · 獨立測試模式</small></div>
  <div class="topActions">
    <button id="centerMap" title="整張地圖">全營檢視</button>
    <button id="togglePanel" title="收合/開啟面板">物件面板 ☰</button>
    <a href="./index.html">返回遊戲</a>
  </div>
</header>
<aside id="editorPanel" aria-label="物件編輯工具">
  <div class="panelTop"><h2>選擇物件</h2><span id="status">尚未選取</span></div>
  <section class="createTools" aria-label="新增物件工具">
    <strong>新增物件</strong>
    <div class="twoCols"><label>素材分類<select id="newCategory"><option value="prop">道具／裝飾</option><option value="building">建築</option></select></label>
    <label>模型種類<select id="newTemplate" aria-label="新增模型種類"></select></label></div>
    <button id="addObject" class="primary block">＋ 新增到鏡頭中心</button>
    <p class="miniTip">先選模型，再新增；也能複製場上已有的物件。新增後可拖曳、旋轉和縮放。</p>
  </section>
  <input id="search" type="search" placeholder="搜尋：路燈、營舍、籃框…" aria-label="搜尋物件">
  <select id="objectList" size="8" aria-label="選取場景中的物件"></select>
  <div class="rowButtons">
    <button id="focus">聚焦選取</button><button id="prev">上一個</button><button id="next">下一個</button>
  </div>
  <div class="separator"></div>
  <div id="details" class="details"><p>點擊場景內的建築或道具，或在清單中選取。</p></div>
  <div class="fields" id="fields" hidden>
    <div class="twoCols">
      <label>X 位置<input id="posX" type="number" step="0.1"></label>
      <label>Z 位置<input id="posZ" type="number" step="0.1"></label>
    </div>
    <label>旋轉角度（°）<input id="yaw" type="number" step="5"></label>
    <label>物件大小（原始比例 = 1.00）<input id="size" type="number" min="0.1" max="5" step="0.05"></label>
    <div class="nudge">
      <span>精細移動</span>
      <div class="arrows"><button data-move="z+">↑</button><button data-move="x-">←</button><button data-move="z-">↓</button><button data-move="x+">→</button></div>
      <div class="rowButtons"><button data-rotate="-15">↶ 15°</button><button data-rotate="15">15° ↷</button><button data-scale="0.9">縮小</button><button data-scale="1.1">放大</button></div>
    </div>
    <div class="rowButtons"><button id="duplicateObject">＋ 複製選取</button><button id="deleteObject" class="danger">刪除選取</button></div>
    <button id="resetOne" class="ghost block">重設這個物件</button>
  </div>
  <div class="separator"></div>
  <div class="rowButtons"><button id="undo">↶ 復原</button><button id="redo">↷ 重做</button><button id="resetAll" class="warning">全部還原</button></div>
  <div class="rowButtons"><button id="export" class="primary">匯出配置 JSON</button><button id="import">匯入 JSON</button><input id="importFile" type="file" accept=".json,application/json" hidden></div>
  <p class="hint">編輯器內會自動暫存到本機瀏覽器，正式遊戲不會跟著改。等你調好後，把匯出的 JSON 給我，我再把配置、碰撞與互動點寫回正式版。</p>
</aside>
<div class="instructions">
  <strong id="toolLabel">操作說明</strong>
  <span>左鍵點選並拖曳：移動物件　｜　空白處拖曳：平移視角　｜　Delete 刪除　｜　Ctrl+D 複製</span>
  <span>右鍵拖曳：旋轉鏡頭　｜　滾輪：遠近縮放　｜　選取後可用面板調旋轉、比例</span>
</div>
<div class="zoomButtons"><button id="zoomIn">＋</button><button id="zoomOut">－</button></div>
<script type="module" src="./editor.js?v=126"></script>
</body>
</html>
