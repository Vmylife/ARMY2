<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#203229" />
<title>豆腐干棉被｜第一階段：水與火 v0.3</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#f6f6e8;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#17271f}
body{display:flex;justify-content:center;align-items:center}
.app{width:min(100%,560px);height:100%;max-height:1080px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 36%,#354e3f 0%,#263a2e 43%,#14251d 88%)}
.app::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(102deg,transparent 0,transparent 93px,#c3d2b809 94px,#c3d2b809 96px,transparent 97px,transparent 188px);mask-image:linear-gradient(to bottom,#0005,transparent 87%)}
.header{position:absolute;z-index:6;top:0;left:0;right:0;padding:calc(16px + env(safe-area-inset-top)) 17px 0}
.toprow{display:flex;gap:12px;align-items:start;justify-content:space-between}
.toprow h1{font-size:clamp(20px,4.2vw,25px);letter-spacing:1px;margin:0 0 5px;font-weight:900;line-height:1.2}
.subtitle{font-size:12px;color:#c9d4be;line-height:1.5}
.reset{border:1px solid #acc0a680;color:#f8f8e8;border-radius:11px;background:#3c5142d9;font-weight:800;font-size:12px;min-height:40px;min-width:82px;padding:8px 10px;touch-action:manipulation}
.meters{margin-top:15px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.meter{background:#17251cbb;border:1px solid #9daa8a56;border-radius:13px;padding:9px 10px;box-shadow:0 7px 12px #07100a35}
.meter-label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#e9eedb;margin-bottom:6px}
.meter-label strong{font-variant-numeric:tabular-nums;color:white}
.track{background:#101a14;border-radius:100px;height:9px;overflow:hidden}
.progress{height:100%;width:32%;border-radius:100px;transition:width .10s linear}
#waterProgress{background:linear-gradient(90deg,#adc68e,#659978,#4b83ae)}
#burnProgress{width:0;background:linear-gradient(90deg,#d1b05f,#e67c37,#7d3e25,#202020)}
.artframe{position:absolute;left:0;right:0;top:23%;height:52%;max-height:560px;min-height:300px;display:flex;justify-content:center;align-items:center;pointer-events:none}
#scene{width:100%;height:100%;max-width:580px;overflow:visible;filter:drop-shadow(0 10px 9px #07140b26)}
.blanket{transform-origin:306px 331px;transition:transform .22s ease,opacity .24s ease;}
#baseFabric,#frontFabric,#hemStroke,#rimLine,#seamTop,#creaseA,#creaseB,#creaseC{transition:fill .18s ease,stroke .18s ease}
#folds{transition:opacity .24s ease}
#wetShine,#wetBlotches,#charBlotches,#ashes,#flameFx,#waterFx,#smokeFx,#steamFx,#puddle,#drips,#puffLines{transition:opacity .18s linear}
#waterFx,#flameFx,#steamFx,#smokeFx,#puddle,#ashes,#drips,#charBlotches,#wetBlotches{pointer-events:none}
#waterFx{opacity:0}
#flameFx{opacity:0}
#steamFx{opacity:0}
#smokeFx{opacity:0}
#ashes{opacity:0}
#drips{opacity:0}
#puddle{opacity:0}
#charBlotches{opacity:0}
#wetBlotches{opacity:0}
#wetShine{opacity:0}
#dryDust{opacity:0;transition:opacity .2s}
#smokeFx path{animation:floatUp 2.1s infinite ease-out;transform-origin:center}
#smokeFx path:nth-child(2){animation-delay:.4s}
#smokeFx path:nth-child(3){animation-delay:1s}
#steamFx path{animation:floatUp 1.5s infinite ease-out}
#waterFx ellipse,#waterFx path{animation:fallDrop .72s infinite linear}
#waterFx ellipse:nth-child(2){animation-delay:-.27s}
#waterFx ellipse:nth-child(3){animation-delay:-.51s}
#flameFx path{animation:flicker .22s infinite alternate ease-in-out;transform-origin:344px 313px}
#flameFx path:nth-child(2){animation-delay:-.11s;transform-origin:386px 290px}

#wateringCan,#lighterFx{transition:opacity .18s linear;pointer-events:none}
#wateringCan{opacity:0}
#lighterFx{opacity:0}
#wateringCan .can-bob{animation:canBob 1.4s ease-in-out infinite;transform-origin:498px 96px}
#lighterFx .lighter-bob{animation:lighterBob .8s ease-in-out infinite alternate;transform-origin:334px 471px}
#lighterFx .flameCore{animation:flicker .18s infinite alternate ease-in-out;transform-origin:332px 429px}
#lighterFx .flameGlow{animation:flicker .24s infinite alternate ease-in-out;transform-origin:332px 429px}
@keyframes canBob{0%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(-4deg) translateY(2px)}100%{transform:rotate(-6deg) translateY(0)}}
@keyframes lighterBob{0%{transform:translateY(0)}100%{transform:translateY(1px)}}
#drips path{animation:fallDrop 1.15s infinite linear}
#drips path:nth-child(2){animation-delay:-.56s}
#drips path:nth-child(3){animation-delay:-.27s}
@keyframes floatUp{0%{transform:translateY(8px) scale(.8);opacity:.2}33%{opacity:.8}100%{transform:translateY(-44px) scale(1.3);opacity:0}}
@keyframes flicker{0%{transform:scaleY(.83) skewX(-4deg)}100%{transform:scaleY(1.15) skewX(4deg)}}
@keyframes fallDrop{0%{transform:translateY(-12px);opacity:0}25%{opacity:1}100%{transform:translateY(47px);opacity:0}}
.state{position:absolute;z-index:5;left:15px;right:15px;bottom:calc(105px + env(safe-area-inset-bottom));padding:13px 15px;border-radius:17px;background:#101b14e6;border:1px solid #9aaa8b6a;box-shadow:0 9px 22px #030a055c}
.state-name{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:18px;font-weight:900;margin-bottom:5px}
.state-tag{font-size:11px;font-weight:700;background:#9ba77f23;border:1px solid #baca9880;color:#dce9bc;padding:5px 9px;white-space:nowrap;border-radius:99px}
.state-desc{font-size:12px;line-height:1.5;color:#cfd9c6}
.controls{position:absolute;z-index:7;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:11px 15px calc(15px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,#0c1710ba 12%,#0a150dee 55%)}
.tool{border:1px solid #aec4b26e;border-radius:17px;min-height:78px;display:flex;align-items:center;justify-content:center;gap:9px;font:inherit;font-size:17px;font-weight:900;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.tool span{font-size:25px}
.tool small{font-weight:500;font-size:11px;display:block;line-height:1.6;color:#e5ecda}
.tool.water{background:linear-gradient(160deg,#2e728f,#235069)}
.tool.fire{background:linear-gradient(160deg,#91532b,#68331d)}
.tool.active{filter:brightness(1.28);transform:scale(.978);border-color:#fff9}
.tool:disabled{opacity:.55;filter:grayscale(.8);cursor:default}
@media(max-height:720px){.artframe{top:20%;height:54%}.state{padding:9px 12px;bottom:calc(95px + env(safe-area-inset-bottom))}.state-name{font-size:16px}.tool{min-height:67px}.controls{padding-top:7px}}
@media(max-width:390px){.header{padding-left:12px;padding-right:12px}.toprow h1{font-size:20px}.subtitle{font-size:11px}.state{left:11px;right:11px}.controls{gap:8px;padding-left:11px;padding-right:11px}}
</style>

<script>

  const watBtn=$('waterBtn'),firBtn=$('fireBtn');
  const waterLabel=$('waterValue'),burnLabel=$('burnValue'),waterBar=$('waterProgress'),burnBar=$('burnProgress');
  const blanket=$('blanketGroup'),waterFx=$('waterFx'),flameFx=$('flameFx'),steamFx=$('steamFx'),smokeFx=$('smokeFx'),wetBlotches=$('wetBlotches'),wetShine=$('wetShine'),charBlotches=$('charBlotches'),puddle=$('puddle'),drips=$('drips'),ashes=$('ashes');
  const stops=[$('fStop1'),$('fStop2'),$('fStop3'),$('fStop4')], edgeStops=[$('edgeStop1'),$('edgeStop2')];
  const clamp=(x,min=0,max=100)=>Math.min(max,Math.max(min,x));
  // Work exclusively with RGB arrays. Previous version accidentally passed 'rgb(...)'
  // strings into a parser for hexadecimal colors; that made the quilt black.
  const hex=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];
  const lerp=(a,b,t)=>a+(b-a)*t;
  const blend=(a,b,t)=>a.map((n,i)=>Math.round(lerp(n,b[i],clamp(t,0,1))));
  const rgb=a=>`rgb(${a[0]},${a[1]},${a[2]})`;
  let moisture=32,burn=0,ash=false,action=null,last=performance.now(),lastRender=0;
  const dry=hex('#aaa979'),fresh=hex('#7f995f'),wet=hex('#3e775e'),soggy=hex('#315f59');
  const burnt=hex('#aa723d'),char=hex('#353532');
  function state(){
    if(ash)return ['灰燼','被子消失','你把整張棉被燒成灰了！這個狀態無法再用水恢復，只能重新開始。'];
    if(burn>=67)return ['焦黑冒煙','燒焦','大塊布料已經焦黑冒煙，快燒成灰了。'];
    if(burn>=24)return ['焦黃捲曲','危險','邊角乾裂發黃，表面出現明顯焦斑。再烤會變成焦炭。'];
    if(moisture<8)return ['乾到發脆','極乾','顏色變淡發黃，棉被又硬又挺，碰到火很容易焦。'];
    if(moisture<23)return ['偏乾硬挺','乾','水分不足，表面泛黃、皺摺變得硬邦邦。'];
    if(moisture<44)return ['蓬鬆乾爽','正常','這才是正常的軍綠色棉被：有厚度、有皺摺，還算柔軟。'];
    if(moisture<65)return ['微濕滲水','微濕','棉被顏色變深，出現一塊塊不規則水痕。'];
    if(moisture<85)return ['濕透滴水','全濕','棉被吸飽水，明顯變重下垂，側邊開始滴水。'];
    return ['泡水軟爛','最濕','整張棉被浸滿水，濕得發亮，軟趴趴地攤在床上。'];
  }
  function update(){
    const m=moisture/100,b=burn/100, [name,tag,desc]=state();
    $('stateName').textContent=name; $('stateTag').textContent=tag; $('stateDesc').textContent=desc;
    waterLabel.textContent=`${Math.round(moisture)}%`;burnLabel.textContent=`${Math.round(burn)}%`;
    waterBar.style.width=`${moisture}%`;burnBar.style.width=`${burn}%`;
    let color=blend(dry,fresh,clamp(moisture/32,0,1));
    if(moisture>32)color=blend(fresh,wet,clamp((moisture-32)/45,0,1));
    if(moisture>77)color=blend(wet,soggy,clamp((moisture-77)/23,0,1));
    color=blend(color,burnt,clamp(burn/48,0,1));
    color=blend(color,char,clamp((burn-38)/52,0,1));
    // Four different light/dark tones keep the quilt volumetric in every state.
    stops[0].setAttribute('stop-color',rgb(blend(color,[245,245,193],.26)));
    stops[1].setAttribute('stop-color',rgb(blend(color,[243,252,199],.08)));
    stops[2].setAttribute('stop-color',rgb(color));
    stops[3].setAttribute('stop-color',rgb(blend(color,[12,29,20],.28)));
    edgeStops[0].setAttribute('stop-color',rgb(blend(color,[15,42,29],.23)));
    edgeStops[1].setAttribute('stop-color',rgb(blend(color,[10,25,18],.55)));
    $('baseFabric').setAttribute('stroke',rgb(blend(color,[17,40,24],.46)));
    // Moist fabric loses puff volume and visibly sags over the front edge.
    const sag=clamp((moisture-30)/70,0,1);
    const stiffness=clamp((25-moisture)/25,0,1);
    const scaleY=1 + sag*.065 - stiffness*.03;
    const scaleX=1 + sag*.022 - stiffness*.008;
    blanket.setAttribute('transform',`translate(${305*(1-scaleX)} ${330*(1-scaleY)+sag*12}) scale(${scaleX} ${scaleY})`);
    $('folds').setAttribute('opacity',String(.78+stiffness*.16-sag*.23));
    $('puffLines').setAttribute('opacity',String(.92-sag*.50));
    $('dryDust').style.opacity=String(clamp((20-moisture)/16,0,1)*(1-clamp(burn/20,0,1)));
    wetBlotches.style.opacity=String(clamp((moisture-37)/35,0,.72));
    wetShine.style.opacity=String(clamp((moisture-57)/43,0,.85));
    puddle.style.opacity=String(clamp((moisture-66)/34,0,1));
    drips.style.opacity=String(clamp((moisture-68)/22,0,1));
    charBlotches.style.opacity=String(clamp((burn-11)/62,0,1));
    $('hemStroke').setAttribute('opacity',String(.66-clamp(burn/100,0,.5)));
    $('stitching').setAttribute('opacity',String(1-clamp((burn-40)/58,0,.75)));
    // Ash is drawn below the tool effects as a remaining identifiable fabric pile.
    blanket.setAttribute('opacity',String(ash?0:Math.max(.01,1-clamp((burn-87)/13,0,1))));
    ashes.style.opacity=String(ash?1:clamp((burn-87)/13,0,1));
    steamFx.style.opacity=String(action==='fire'&&!ash?clamp((moisture-12)/48,0,.95):0);
    smokeFx.style.opacity=String((burn>49&&!ash)?clamp((burn-49)/32,0,.9):(ash?.35:0));
    waterFx.style.opacity=String(action==='water'&&!ash?1:0);
    $('wateringCan').style.opacity=String(action==='water'&&!ash?1:0);
    flameFx.style.opacity=String(action==='fire'&&!ash?clamp((42-moisture)/36,0,1):0);
    $('lighterFx').style.opacity=String(action==='fire'&&!ash?1:0);
    // Keep even burnt quilt visually textured, never pure black.
    firBtn.disabled=watBtn.disabled=ash;
  }
  function setAction(which){
    if(ash && which)return;
    action=which;
    watBtn.classList.toggle('active',which==='water'); firBtn.classList.toggle('active',which==='fire');
    update();
  }
  function bind(btn,which){
    let pressedAt=0;
    btn.addEventListener('pointerdown',e=>{
      if(ash)return;
      e.preventDefault();
      pressedAt=performance.now();
      try{btn.setPointerCapture(e.pointerId);}catch(_){}
      setAction(which);
    });
    for(const eventName of ['pointerup','pointercancel','lostpointercapture']){
      btn.addEventListener(eventName,()=>{if(action===which)setAction(null);});
    }
    // A quick tap still changes the blanket; a long hold won't get an extra boost on release.
    btn.addEventListener('click',()=>{
      if(ash)return;
      if(performance.now()-pressedAt<170){step(which,.25);update();}
    });
  }
  function step(which,dt){
    if(ash)return;
    if(which==='water'){
      moisture=clamp(moisture+dt*26);
      // Moisture stops active combustion, but char marks do not vanish magically.
      if(burn>0)burn=clamp(burn-dt*2,0,100);
    }else if(which==='fire'){
      moisture=clamp(moisture-dt*29);
      if(moisture<20) burn=clamp(burn+dt*(moisture<6?29:13));
    }
    if(burn>=99.7){burn=100;ash=true;setAction(null);}
  }
  bind(watBtn,'water');bind(firBtn,'fire');
  window.addEventListener('blur',()=>setAction(null));
  $('reset').addEventListener('click',()=>{moisture=32;burn=0;ash=false;setAction(null);update();});
  function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;if(action)step(action,dt);if(now-lastRender>60){update();lastRender=now;} requestAnimationFrame(frame);}
  window.__blanketStageDebug=()=>({moisture,burn,ash,action,state:state()[0],fabric:stops[2].getAttribute('stop-color')});
  update();requestAnimationFrame(frame);
})();
</script>
</body>
