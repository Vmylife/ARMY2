<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#203229" />
<title>豆腐干棉被｜第一到三階段：水火刷洗＋實體對折＋最後整理 v1.2</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#f6f6e8;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#17271f}
body{display:flex;justify-content:center;align-items:center}
.app{width:min(100%,560px);height:100%;max-height:1080px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 36%,#354e3f 0%,#263a2e 43%,#14251d 88%)}
.app::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(102deg,transparent 0,transparent 93px,#c3d2b809 94px,#c3d2b809 96px,transparent 97px,transparent 188px);mask-image:linear-gradient(to bottom,#0005,transparent 87%)}
.header{position:absolute;z-index:6;top:0;left:0;right:0;padding:calc(16px + env(safe-area-inset-top)) 17px 0}
.toprow{display:flex;gap:12px;align-items:start;justify-content:space-between}
.toprow h1{font-size:clamp(20px,4.2vw,25px);letter-spacing:1px;margin:0 0 5px;font-weight:900;line-height:1.2}
.subtitle{font-size:12px;color:#c9d4be;line-height:1.5}
.reset{border:1px solid #acc0a680;color:#f8f8e8;border-radius:11px;background:#3c5142d9;font-weight:800;font-size:12px;min-height:40px;min-width:82px;padding:8px 10px;touch-action:manipulation}
.meters{margin-top:15px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.meter{background:#17251cbb;border:1px solid #9daa8a56;border-radius:13px;padding:9px 10px;box-shadow:0 7px 12px #07100a35}
.meter.clean{grid-column:1 / -1}
[hidden],#memoryOverlay[hidden],#stage2Controls[hidden],#stage2Info[hidden],#stage2Result[hidden],#stage3Panel[hidden]{display:none!important;pointer-events:none!important}
.meter-label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#e9eedb;margin-bottom:6px}
.meter-label strong{font-variant-numeric:tabular-nums;color:white}
.track{background:#101a14;border-radius:100px;height:9px;overflow:hidden}
.progress{height:100%;width:32%;border-radius:100px;transition:width .10s linear}
#waterProgress{background:linear-gradient(90deg,#adc68e,#659978,#4b83ae)}
#burnProgress{width:0;background:linear-gradient(90deg,#d1b05f,#e67c37,#7d3e25,#202020)}
#dirtyProgress{width:82%;background:linear-gradient(90deg,#6f5a32,#a26b2d,#c16a36,#d84837)}
.artframe{position:absolute;left:0;right:0;top:23%;height:52%;max-height:560px;min-height:300px;display:flex;justify-content:center;align-items:center;pointer-events:auto}
#scene{width:100%;height:100%;max-width:580px;overflow:visible;filter:drop-shadow(0 10px 9px #07140b26)}
.blanket{transform-origin:306px 331px;transition:transform .22s ease,opacity .24s ease;}
#baseFabric,#frontFabric,#hemStroke,#rimLine,#seamTop,#creaseA,#creaseB,#creaseC{transition:fill .18s ease,stroke .18s ease}
#folds{transition:opacity .24s ease}
#wetShine,#wetBlotches,#charBlotches,#ashes,#flameFx,#waterFx,#smokeFx,#steamFx,#puddle,#drips,#puffLines{transition:opacity .18s linear}
#waterFx,#flameFx,#steamFx,#smokeFx,#puddle,#ashes,#drips,#charBlotches,#wetBlotches{pointer-events:none}
#dirtLayer .trash,#dirtLayer .stain{transition:opacity .15s linear}
#dirtLayer .trash{pointer-events:none;will-change:transform}
#moldLayer{pointer-events:none;transition:opacity .25s ease}
#moldLayer .mushroom{transition:transform .24s ease}
#scene,#scrubArea{touch-action:none}
#scrubArea{pointer-events:all;cursor:grab}
#scrubArea.scrubbing{cursor:grabbing}
#scrubFx circle{transition:opacity .22s linear}
#waterFx{opacity:0}
#flameFx{opacity:0}
#steamFx{opacity:0}
#smokeFx{opacity:0}
#ashes{opacity:0}
#drips{opacity:0}
#puddle{opacity:0}
#charBlotches{opacity:0}
#wetBlotches{opacity:0}
#wetShine{opacity:0}
#dryDust{opacity:0;transition:opacity .2s}
#smokeFx path{animation:floatUp 2.1s infinite ease-out;transform-origin:center}
#smokeFx path:nth-child(2){animation-delay:.4s}
#smokeFx path:nth-child(3){animation-delay:1s}
#steamFx path{animation:floatUp 1.5s infinite ease-out}
#waterFx ellipse,#waterFx path{animation:fallDrop .72s infinite linear}
#waterFx ellipse:nth-child(2){animation-delay:-.27s}
#waterFx ellipse:nth-child(3){animation-delay:-.51s}
#flameFx path{animation:flicker .22s infinite alternate ease-in-out;transform-origin:344px 313px}
#flameFx path:nth-child(2){animation-delay:-.11s;transform-origin:386px 290px}

/* Both tools are detailed SVG props, not emojis or floating circles. */
#wateringCan,#lighterFx{opacity:0;transition:opacity .15s ease;pointer-events:none}
#wateringCan .can-group{animation:tipCan 1.3s ease-in-out infinite;transform-origin:187px 105px}
@keyframes tipCan{0%,100%{transform:rotate(-1deg) translateY(0)}50%{transform:rotate(2deg) translateY(-3px)}}
#waterFx .stream{stroke-dasharray:3 11;animation:rainFlow .52s linear infinite;stroke-linecap:round}
#waterFx .stream:nth-child(2n){animation-duration:.67s;animation-delay:-.17s}
#waterFx .splash{animation:splashPulse .44s ease-in-out infinite alternate;transform-origin:center}
#waterFx .splash:nth-child(2n){animation-delay:-.23s}
@keyframes rainFlow{from{stroke-dashoffset:0}to{stroke-dashoffset:-42}}
@keyframes splashPulse{from{opacity:.3;transform:scale(.85)}to{opacity:1;transform:scale(1.09)}}
#lighterFx .lighter{animation:lighterBob .7s ease-in-out infinite alternate;transform-origin:333px 494px}
#lighterFx .flameOutline{animation:flicker .2s infinite alternate ease-in-out;transform-origin:331px 448px}
#lighterFx .flameHeart{animation:flicker .16s infinite alternate ease-in-out;transform-origin:331px 448px;animation-delay:-.08s}
#flameFx .heat-wave{animation:heatDance .6s ease-in-out infinite alternate}
@keyframes heatDance{from{transform:translateY(2px);opacity:.18}to{transform:translateY(-3px);opacity:.55}}
@keyframes lighterBob{from{transform:translateY(0)}to{transform:translateY(1.5px)}}
@keyframes floatUp{0%{transform:translateY(8px) scale(.8);opacity:.2}33%{opacity:.8}100%{transform:translateY(-44px) scale(1.3);opacity:0}}
@keyframes flicker{0%{transform:scaleY(.83) skewX(-4deg)}100%{transform:scaleY(1.15) skewX(4deg)}}
@keyframes fallDrop{0%{transform:translateY(-12px);opacity:0}25%{opacity:1}100%{transform:translateY(47px);opacity:0}}
.state{position:absolute;z-index:5;left:15px;right:15px;bottom:calc(105px + env(safe-area-inset-bottom));padding:13px 15px;border-radius:17px;background:#101b14e6;border:1px solid #9aaa8b6a;box-shadow:0 9px 22px #030a055c}
.state-name{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:18px;font-weight:900;margin-bottom:5px}
.state-tag{font-size:11px;font-weight:700;background:#9ba77f23;border:1px solid #baca9880;color:#dce9bc;padding:5px 9px;white-space:nowrap;border-radius:99px}
.state-desc{font-size:12px;line-height:1.5;color:#cfd9c6}
.controls{position:absolute;z-index:7;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:11px 15px calc(15px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,#0c1710ba 12%,#0a150dee 55%)}
.tool{border:1px solid #aec4b26e;border-radius:17px;min-height:78px;display:flex;align-items:center;justify-content:center;gap:9px;font:inherit;font-size:17px;font-weight:900;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.tool span{font-size:25px}
.tool small{font-weight:500;font-size:11px;display:block;line-height:1.6;color:#e5ecda}
.tool.water{background:linear-gradient(160deg,#2e728f,#235069)}
.tool.fire{background:linear-gradient(160deg,#91532b,#68331d)}
.tool.active{filter:brightness(1.28);transform:scale(.978);border-color:#fff9}
.tool:disabled{opacity:.55;filter:grayscale(.8);cursor:default}
@media(max-height:720px){.artframe{top:20%;height:54%}.state{padding:9px 12px;bottom:calc(95px + env(safe-area-inset-bottom))}.state-name{font-size:16px}.tool{min-height:67px}.controls{padding-top:7px}}
@media(max-width:390px){.header{padding-left:12px;padding-right:12px}.toprow h1{font-size:20px}.subtitle{font-size:11px}.state{left:11px;right:11px}.controls{gap:8px;padding-left:11px;padding-right:11px}}

/* Standalone second stage: memorise an outline for one second, then draw it from memory. */
.next-stage{width:100%;margin-top:10px;padding:9px 13px;background:linear-gradient(135deg,#83a45d,#537e55);border:1px solid #cfefaa80;border-radius:12px;color:#fcffeb;font:inherit;font-size:14px;font-weight:900;min-height:40px;cursor:pointer;touch-action:manipulation}
.next-stage:active{filter:brightness(1.2)}
#memoryOverlay{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;margin:0;touch-action:none;z-index:20;pointer-events:auto;overscroll-behavior:none;background:linear-gradient(180deg,#18372e 0%,#11271f 48%,#0a1914 100%)}
#drawingSurface{pointer-events:all;cursor:crosshair}
#memoryTarget,#memoryGhost,#memoryInk,#memorySplash{pointer-events:none}
.stage2-info{position:fixed;z-index:23;left:12px;right:12px;top:calc(6px + env(safe-area-inset-top));text-align:center;padding:8px 11px;border-radius:14px;background:#14231de0;border:1px solid #b5c7ab75;box-shadow:0 8px 20px #07140b45;pointer-events:none}
.memory-round{font-weight:900;font-size:14px;color:#f4ecd0;letter-spacing:1px}
.memory-instruction{margin-top:5px;font-size:15px;font-weight:800;color:#e3f7e1}
.scores-mini{font-size:12px;color:#b6d3be;margin-top:5px}
.stage2-result{position:fixed;z-index:24;top:calc(30% - 65px);left:50%;transform:translateX(-50%);width:min(84%,320px);background:#0c1b17f1;border:1px solid #c4d9bda0;border-radius:18px;box-shadow:0 9px 34px #020905a8;text-align:center;padding:16px 13px;pointer-events:none}
.result-title{font-size:32px;line-height:1.15;color:#fff0b5;font-weight:1000}
.result-subtitle{margin-top:6px;font-size:13px;color:#d2e6d7}
.stage2-controls{position:fixed;z-index:24;bottom:0;left:0;right:0;padding:8px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,#101a16e8 15%,#0a1310 70%)}
.stage2-tip{font-size:12px;color:#d6e9d4;text-align:center;margin-bottom:9px}
.stage2-buttons{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.stage2-buttons button{min-height:66px;border-radius:15px;font:inherit;font-weight:900;font-size:20px;touch-action:manipulation}
.redraw-btn{background:#405a4d;color:#f2f6e7;border:1px solid #9daf9f74}
.fold-btn{background:linear-gradient(145deg,#e8b969,#bb732e);color:#22190c;border:1px solid #ffe2a4}
.fold-btn:disabled{filter:grayscale(.7);opacity:.53}

#memoryBgStage{pointer-events:none}
#memoryBgBlanketWrap{pointer-events:none;filter:drop-shadow(0 8px 5px rgba(0,0,0,.28))}
#foldRig{transform-origin:300px 332px}
#foldHingeShadow{pointer-events:none;opacity:0}
#foldEdgeDetails{pointer-events:none}
#foldEdgeDetails path{stroke-linejoin:round;stroke-linecap:round}
#memoryOverlay.is-folding #memoryInk,#memoryOverlay.is-folding #memoryGhost{opacity:.20}
.stage2-extra{margin-top:10px}
.final-btn{width:100%;min-height:56px;border-radius:16px;border:1px solid #d9e1af8c;background:linear-gradient(145deg,#8fb267,#5f834e);color:#f7fde8;font:inherit;font-weight:1000;font-size:19px;touch-action:manipulation}
.final-btn[hidden],#memoryOverlay[hidden],#stage2Controls[hidden],#stage2Info[hidden],#stage2Result[hidden],#stage3Panel[hidden]{display:none!important;pointer-events:none!important}
.stage3-panel{position:fixed;z-index:25;left:14px;right:14px;top:calc(76px + env(safe-area-inset-top));padding:18px 16px;border-radius:20px;background:#102019eb;border:1px solid #c1d2b380;box-shadow:0 16px 42px #04110ab8;color:#eef7e8;text-align:center}
.stage3-panel h2{margin:0 0 8px;font-size:24px;line-height:1.2}
.stage3-panel p{margin:8px 0 0;font-size:14px;line-height:1.7;color:#d5e5d1}
.stage3-actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
.stage3-actions button{min-height:54px;border-radius:15px;font:inherit;font-weight:900;font-size:17px;background:linear-gradient(145deg,#d8bb72,#b88734);color:#22190c;border:1px solid #ffe3af}
@media(max-height:730px){.stage2-info{top:calc(4px + env(safe-area-inset-top));padding:6px 9px}.memory-instruction{font-size:13px}.stage2-buttons button{min-height:56px}.stage2-controls{padding-top:6px}.stage2-result{top:25%}}
@media(max-width:410px){.stage2-info{left:10px;right:10px;top:calc(6px + env(safe-area-inset-top));padding:7px 9px}.stage2-result{width:82%}}
/* iOS Safari: game UI must not become selectable text / blue native handles. */
html,body,.app,.app *,svg,svg *,#memoryOverlay,#memoryOverlay *{
  -webkit-user-select:none !important;
  user-select:none !important;
  -webkit-touch-callout:none !important;
  -webkit-tap-highlight-color:transparent !important;
  -webkit-user-drag:none;
}
img,svg{ -webkit-user-drag:none; }
#scrubArea,#memoryOverlay,#drawingSurface{touch-action:none !important;}
button{touch-action:manipulation;}

/* 第三階段：高速反覆充滿／清空，直接點整理抓 MAX */
#stage3Panel{top:calc(17px + env(safe-area-inset-top));bottom:auto;max-height:calc(100dvh - 45px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch;}
#stage3Panel .stage3-intro{font-size:13px;color:#d6e7d2;margin:4px 0 18px}
.stage3-meter-labels{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:900;margin:0 0 7px;gap:8px}
.stage3-meter-labels .max-label{color:#ffef9c;letter-spacing:1px;text-shadow:0 0 9px #ffe08e80}
.stage3-meter{position:relative;height:40px;overflow:hidden;border:2px solid #bacda882;border-radius:12px;background:linear-gradient(180deg,#050f09,#132019);box-shadow:inset 0 2px 8px #0008}
.stage3-meter::after{content:"";position:absolute;inset:0 0 0 auto;width:10%;background:linear-gradient(90deg,#fff1a000,#ffe78451);border-left:2px dashed #ffe8a7b3;pointer-events:none}
.stage3-fill{height:100%;width:0%;background:linear-gradient(90deg,#3c875f,#80c66a 53%,#e1df6d 86%,#ffe69e 100%);box-shadow:0 0 16px #9ad27698;will-change:width}
.stage3-needle{position:absolute;top:0;bottom:0;left:0%;width:3px;transform:translateX(-50%);background:#f6ffdf;box-shadow:0 0 10px #fffab3;pointer-events:none;will-change:left}
.stage3-meter-readout{font-size:15px;color:#f2e9c5;margin-top:9px;font-weight:900;font-variant-numeric:tabular-nums}
#tidyButton{width:100%;margin-top:18px;padding:14px;min-height:70px;border-radius:16px;border:1px solid #ffe8ad;background:linear-gradient(145deg,#f7d07e,#b77e31);color:#25190c;font:inherit;font-size:25px;font-weight:1000;touch-action:manipulation;box-shadow:0 5px 0 #68491f}
#tidyButton:active{transform:translateY(3px);box-shadow:0 2px 0 #68491f}
#stage3Panel.summary-mode{top:calc(14px + env(safe-area-inset-top));background:#102019}
.summary-result-name{font-size:27px;font-weight:1000;letter-spacing:.6px;color:#f4e7a4;margin:5px 0 12px}
.summary-total{font-size:44px;font-weight:1000;line-height:1.14;color:#fbe9b1;font-variant-numeric:tabular-nums}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 12px}
.summary-stat{border:1px solid #a5b69a65;background:#ffffff0b;border-radius:13px;padding:10px 8px;line-height:1.4}
.summary-stat strong{font-size:19px;display:block;color:#fff6ce}
.summary-stat span{font-size:12px;color:#cfdfd1}
.summary-detail{border-top:1px solid #ffffff26;padding-top:10px;font-size:13px;line-height:1.75;color:#d9e6d6;text-align:left}
.summary-note{font-size:12px;color:#bdcdb7;margin:11px 0 2px}
#stage3RestartBtn{width:100%}
@media(max-height:740px){#stage3Panel{padding:12px;top:calc(7px + env(safe-area-inset-top));}.stage3-panel h2{font-size:21px}.summary-result-name{font-size:24px}.summary-total{font-size:37px}.summary-grid{gap:6px;margin:8px 0}.stage3-meter{height:33px}#tidyButton{min-height:58px}}
</style>
</head>
<body>
<div class="app">
 <div class="header">
  <div class="toprow">
   <div><h1>報告長官！這不是豆腐乾</h1><div class="subtitle" id="stageSubtitle">第一階段｜棉被乾濕度、焦化與刷洗</div></div>
   <button class="reset" id="reset" type="button">重新開始</button>
  </div>
  <div class="meters" id="stage1Meters">
   <div class="meter"><div class="meter-label">💧 含水量 <strong id="waterValue">32%</strong></div><div class="track"><div class="progress" id="waterProgress"></div></div></div>
   <div class="meter"><div class="meter-label">🔥 焦化度 <strong id="burnValue">0%</strong></div><div class="track"><div class="progress" id="burnProgress"></div></div></div>
   <div class="meter clean"><div class="meter-label">🗑️ 髒亂度 <strong id="dirtyValue">82%</strong></div><div class="track"><div class="progress" id="dirtyProgress"></div></div></div>
  </div>
 </div>
 <div class="artframe">
  <svg id="scene" viewBox="0 0 640 560" role="img" aria-label="一張有厚度、有縫線和皺摺的軍綠色棉被，受水和火影響會改變外形和表面">
   <defs>
    <linearGradient id="roomFloor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6a7f68" stop-opacity=".35"/><stop offset="1" stop-color="#253a30" stop-opacity=".03"/></linearGradient>
    <linearGradient id="mattressTop" x1="0" x2=".5" y1="0" y2="1"><stop stop-color="#d7ddc9"/><stop offset="1" stop-color="#99a99a"/></linearGradient>
    <linearGradient id="mattressFront" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#6f8073"/><stop offset="1" stop-color="#344a3b"/></linearGradient>
    <linearGradient id="fabricGradient" x1="0" x2=".9" y1="0" y2="1">
     <stop id="fStop1" stop-color="#a2b583"/><stop id="fStop2" offset=".34" stop-color="#81975e"/><stop id="fStop3" offset=".69" stop-color="#77935e"/><stop id="fStop4" offset="1" stop-color="#506f44"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2=".6" y2="1"><stop id="edgeStop1" stop-color="#628350"/><stop id="edgeStop2" offset="1" stop-color="#344e37"/></linearGradient>
    <linearGradient id="hem" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c8d4a0" stop-opacity=".66"/><stop offset="1" stop-color="#385d3c" stop-opacity=".35"/></linearGradient>
    <radialGradient id="puffGlow" cx="40%" cy="38%" r="66%"><stop stop-color="#f4ffd4" stop-opacity=".21"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".03"/><stop offset="1" stop-color="#000000" stop-opacity=".20"/></radialGradient>
    <radialGradient id="darkWet"><stop stop-color="#244a58" stop-opacity=".55"/><stop offset="1" stop-color="#244a58" stop-opacity="0"/></radialGradient>
    <radialGradient id="puddleGradient"><stop stop-color="#8bb9cc" stop-opacity=".62"/><stop offset=".67" stop-color="#4a829a" stop-opacity=".30"/><stop offset="1" stop-color="#31536d" stop-opacity="0"/></radialGradient>
    <radialGradient id="burnGradient"><stop stop-color="#121311" stop-opacity=".94"/><stop offset=".52" stop-color="#302720" stop-opacity=".9"/><stop offset=".75" stop-color="#a46126" stop-opacity=".59"/><stop offset="1" stop-color="#cb7729" stop-opacity="0"/></radialGradient>
    <radialGradient id="ashGradient"><stop stop-color="#7d7c70"/><stop offset=".58" stop-color="#5d5f58"/><stop offset=".9" stop-color="#2b302d"/><stop offset="1" stop-color="#212b25" stop-opacity="0"/></radialGradient>
    <radialGradient id="ashBright"><stop stop-color="#acaaa1" stop-opacity=".7"/><stop offset="1" stop-color="#acaaa1" stop-opacity="0"/></radialGradient>
    <linearGradient id="flameColor" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#ff5221"/><stop offset=".45" stop-color="#ff9a25"/><stop offset="1" stop-color="#ffe889"/></linearGradient>

    <!-- Gradients: recognizable painted metal watering can and disposable lighter -->
    <linearGradient id="canBody" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b2d9aa"/><stop offset=".25" stop-color="#78a985"/><stop offset=".6" stop-color="#407a69"/><stop offset="1" stop-color="#235a4f"/></linearGradient>

  function startStage2(){
    stage=2;setAction(null);scrubbing=false;fitMemoryCanvas();
    round=0;roundScores=[];drawPoints=[];foldStep=0;clearStageTimers();
    constructFolds();
    $('stage1Meters').hidden=true;$('stage1State').hidden=true;$('stage1Controls').hidden=true;
    $('stageSubtitle').textContent='第二階段｜記憶折線＋對折動畫（共 3 次）';
    svgHide(overlay,false);$('stage2Info').hidden=false;$('stage2Controls').hidden=false;
    stage3Panel.hidden=true; redrawBtn.hidden=false; foldBtn.hidden=false; finalTidyBtn.hidden=true;
    redrawBtn.textContent='重畫'; renderFoldState();
    startRound();
  }
  function leaveStage2(){
    stopTidy();tidyScore=null;tidyLockedValue=null;stage3Panel.classList.remove('summary-mode');
    stage3Play.hidden=false;stage3Summary.hidden=true;
    clearStageTimers();stage=1;mode='idle';lastDrawPointer=null;foldStep=0;renderFoldState();
    svgHide(overlay,true);$('stage2Info').hidden=true;$('stage2Controls').hidden=true;stage2Result.hidden=true;stage3Panel.hidden=true;
    redrawBtn.hidden=false; foldBtn.hidden=false; finalTidyBtn.hidden=true;
    $('stage1Meters').hidden=false;$('stage1State').hidden=false;$('stage1Controls').hidden=false;
    $('stageSubtitle').textContent='第一階段｜棉被乾濕度、焦化與刷洗';
  }
  function length(points,closed){
    let L=0;for(let i=1;i<points.length;i++)L+=Math.hypot(points[i].x-points[i-1].x,points[i].y-points[i-1].y);
    if(closed&&points.length>=3)L+=Math.hypot(points[0].x-points.at(-1).x,points[0].y-points.at(-1).y);
    return L;
  }
  function samplePolyline(points,closed,n=96){
    if(points.length<2)return [];
    const segments=[];let total=0;
    const end=closed?points.length:points.length-1;
    for(let i=0;i<end;i++){
      const a=points[i],b=points[(i+1)%points.length],L=Math.hypot(a.x-b.x,a.y-b.y);
      if(L<.01)continue;segments.push({a,b,L,begin:total});total+=L;
    }
    if(!total)return [];
    const out=[];let segIndex=0;
    for(let i=0;i<n;i++){
      const dist=total*(closed?i/n:i/(n-1));
      while(segIndex<segments.length-1&&dist>segments[segIndex].begin+segments[segIndex].L)segIndex++;
      const s=segments[segIndex],r=clamp((dist-s.begin)/s.L,0,1);
      out.push({x:s.a.x+(s.b.x-s.a.x)*r,y:s.a.y+(s.b.y-s.a.y)*r});
    }
    return out;
  }
  function nearestDistance(p,points){
    let d=1e9;for(const q of points){const m=(p.x-q.x)**2+(p.y-q.y)**2;if(m<d)d=m;}
    return Math.sqrt(d);
  }
  function similarity(){
    if(drawPoints.length<8||length(drawPoints,false)<35)return 0;
    const T=samplePolyline(targetPoints,true),U=samplePolyline(drawPoints,false);
    if(!T.length||!U.length)return 0;
    const tDist=T.map(p=>nearestDistance(p,U)),uDist=U.map(p=>nearestDistance(p,T));
    const mean=(tDist.reduce((a,b)=>a+b,0)/T.length + uDist.reduce((a,b)=>a+b,0)/U.length)/2;
    const tol=Math.max(20,Math.min(canvasW,canvasH)*.063);
    const coverage=tDist.filter(d=>d<tol).length/T.length;
    const detail=clamp(1-mean/(tol*2.8),0,1);
    const tLen=length(targetPoints,true),uLen=length(drawPoints,false);
    const lenQuality=Math.exp(-1.55*Math.abs(Math.log(Math.max(1,uLen)/tLen)));
    const closure=clamp(1-Math.hypot(drawPoints[0].x-drawPoints.at(-1).x,drawPoints[0].y-drawPoints.at(-1).y)/100,0,1);
    return Math.round(clamp((.62*detail+.23*coverage+.10*lenQuality+.05*closure)*100,0,100));
  }
  // Players may proceed at any time, regardless of water, burn, dirt or ash.
  $('nextStageBtn').addEventListener('click',startStage2);
  finalTidyBtn.addEventListener('click',enterStage3);
  stage3RestartBtn.addEventListener('click',()=>{leaveStage2();moisture=32;burn=0;ash=false;moldAge=0;rerollDirt();scrubbing=false;lastScrubPoint=null;setAction(null);update();});
  tidyButton.addEventListener('click',finishTidy);
  overlay.addEventListener('pointerdown',e=>{
    if(stage!==2||mode!=='draw'||e.button>0)return;
    drawPoints=[svgDrawPoint(e)];lastDrawPointer=e.pointerId;
    memoryInk.setAttribute('d',polyPath(drawPoints,false));
    memorySplash.textContent='';
    foldBtn.disabled=true;
    try{overlay.setPointerCapture(e.pointerId)}catch(_){}
    e.preventDefault();
  });
  overlay.addEventListener('pointermove',e=>{
    if(stage!==2||mode!=='draw'||lastDrawPointer!==e.pointerId)return;
    const p=svgDrawPoint(e),lastPoint=drawPoints.at(-1);
    if(!lastPoint||Math.hypot(p.x-lastPoint.x,p.y-lastPoint.y)>2){
      drawPoints.push(p);memoryInk.setAttribute('d',polyPath(drawPoints,false));
    }
    foldBtn.disabled=drawPoints.length<5;
    e.preventDefault();
  });
  const endStroke=e=>{if(lastDrawPointer!==e.pointerId)return;lastDrawPointer=null;foldBtn.disabled=drawPoints.length<5;};
  overlay.addEventListener('pointerup',endStroke);overlay.addEventListener('pointercancel',endStroke);
  overlay.addEventListener('lostpointercapture',()=>{lastDrawPointer=null;});
  redrawBtn.addEventListener('click',()=>{
    if(stage!==2&&stage!==3)return;
    if(mode==='done' || stage===3){leaveStage2();return;}
    if(mode!=='draw')return;
    drawPoints=[];memoryInk.setAttribute('d','');memorySplash.textContent='';foldBtn.disabled=true;
  });
  foldBtn.addEventListener('click',()=>{
    if(stage!==2)return;
    if(mode!=='draw'||foldBtn.disabled)return;
    const score=similarity();roundScores.push(score);lastDrawPointer=null;
    svgHide(memoryTarget,true);svgHide(memoryGhost,true);svgHide(memoryInk,true);
    stage2Result.hidden=true;
    memorySplash.textContent=round===2?'最後壓實！':'正在翻折棉被…';
    memoryInstruction.textContent=`第 ${round+1} 次：${['右半邊向左翻','下半邊向上翻','最後翻折並壓成豆腐乾'][round]}`;
    stage2Tip.textContent=round===2?'布層壓緊，最後定型':'棉被正沿著折線翻起並落下';
    foldBtn.disabled=true;redrawBtn.disabled=true;
    const thisRound=round;
    const visualScore=roundScores.reduce((a,b)=>a+b,0)/roundScores.length;
    if(round===2)buildTofuResult(visualScore);
    animateFold(round+1,visualScore,()=>{
      if(stage!==2)return;
      memoryGhost.setAttribute('d',polyPath(targetPoints,true));svgHide(memoryGhost,false);
      svgHide(memoryInk,false);
      stage2ResultTitle.textContent=`${score} 分`;
      stage2ResultSubtitle.textContent=thisRound===2?'三次開折完成！':'白色虛線是正確形狀；青色是你畫的';
      stage2Result.hidden=false;
      memorySplash.textContent='';
      memoryInstruction.textContent=thisRound===2?'第三折完成，棉被還在床上！':'這回合的貼合度';
      scoresMini.textContent=roundScores.map((v,i)=>`第${i+1}次 ${v}分`).join('　');
      stage2Tip.textContent=thisRound===2?'三次對折都完成了':'按下開折後，棉被已真正對折一次';
      feedbackTimer=setTimeout(()=>{feedbackTimer=null;if(stage!==2)return;if(thisRound===2){showFinishStage2();}else{round++;startRound();}},1120);
    });
  });
  window.__blanketStageDebug=()=>({stage,round,mode,foldStep,foldForm:foldActive.getAttribute('href'),foldScores:[...foldScores],roundScores:[...roundScores],tidyRunning,tidyScore,tidyLockedValue,tidyCurrent:tidyRunning?tidyValueAt(performance.now()):tidyLockedValue,previewVisible:!memoryTarget.hasAttribute('hidden'),drawPoints:drawPoints.length,moisture,burn,dirt,trashRemaining:trashObjects.filter(o=>!o.removed).length,trashInitial,moldAge,ash,action,scrubbing,canvasW,canvasH,state:state()[0],fabric:stops[2].getAttribute('stop-color')});
  // Native text selection and Safari's callout obscured the game after long presses.
  document.addEventListener('selectstart',e=>e.preventDefault());
  document.addEventListener('dragstart',e=>e.preventDefault());
  document.addEventListener('contextmenu',e=>e.preventDefault());
  // Safari may default to scrolling/selection on SVG surface even with touch-action.
  for(const surface of [scrubArea,overlay]){
    surface.addEventListener('touchstart',e=>{
      if(e.cancelable)e.preventDefault();
    },{passive:false});
  }
  rerollDirt();
  update();requestAnimationFrame(frame);
})();
</script>
