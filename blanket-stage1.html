<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />

<title>豆腐干棉被｜第一、二階段：水火刷洗＋記憶開折 v0.7</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#f6f6e8;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#17271f}
body{display:flex;justify-content:center;align-items:center}
.app{width:min(100%,560px);height:100%;max-height:1080px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 36%,#354e3f 0%,#263a2e 43%,#14251d 88%)}
.app::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(102deg,transparent 0,transparent 93px,#c3d2b809 94px,#c3d2b809 96px,transparent 97px,transparent 188px);mask-image:linear-gradient(to bottom,#0005,transparent 87%)}
.header{position:absolute;z-index:6;top:0;left:0;right:0;padding:calc(16px + env(safe-area-inset-top)) 17px 0}
.toprow{display:flex;gap:12px;align-items:start;justify-content:space-between}
.toprow h1{font-size:clamp(20px,4.2vw,25px);letter-spacing:1px;margin:0 0 5px;font-weight:900;line-height:1.2}
.subtitle{font-size:12px;color:#c9d4be;line-height:1.5}
.reset{border:1px solid #acc0a680;color:#f8f8e8;border-radius:11px;background:#3c5142d9;font-weight:800;font-size:12px;min-height:40px;min-width:82px;padding:8px 10px;touch-action:manipulation}
.meters{margin-top:15px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.meter{background:#17251cbb;border:1px solid #9daa8a56;border-radius:13px;padding:9px 10px;box-shadow:0 7px 12px #07100a35}
.meter.clean{grid-column:1 / -1}
[hidden]{display:none!important}
.meter-label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#e9eedb;margin-bottom:6px}
.meter-label strong{font-variant-numeric:tabular-nums;color:white}
.track{background:#101a14;border-radius:100px;height:9px;overflow:hidden}
.progress{height:100%;width:32%;border-radius:100px;transition:width .10s linear}
#waterProgress{background:linear-gradient(90deg,#adc68e,#659978,#4b83ae)}
#burnProgress{width:0;background:linear-gradient(90deg,#d1b05f,#e67c37,#7d3e25,#202020)}
#dirtyProgress{width:82%;background:linear-gradient(90deg,#6f5a32,#a26b2d,#c16a36,#d84837)}
.artframe{position:absolute;left:0;right:0;top:23%;height:52%;max-height:560px;min-height:300px;display:flex;justify-content:center;align-items:center;pointer-events:auto}
#scene{width:100%;height:100%;max-width:580px;overflow:visible;filter:drop-shadow(0 10px 9px #07140b26)}
.blanket{transform-origin:306px 331px;transition:transform .22s ease,opacity .24s ease;}
#baseFabric,#frontFabric,#hemStroke,#rimLine,#seamTop,#creaseA,#creaseB,#creaseC{transition:fill .18s ease,stroke .18s ease}
#folds{transition:opacity .24s ease}
#wetShine,#wetBlotches,#charBlotches,#ashes,#flameFx,#waterFx,#smokeFx,#steamFx,#puddle,#drips,#puffLines{transition:opacity .18s linear}
#waterFx,#flameFx,#steamFx,#smokeFx,#puddle,#ashes,#drips,#charBlotches,#wetBlotches{pointer-events:none}
#dirtLayer .trash,#dirtLayer .stain{transition:opacity .16s linear}
#scrubArea{pointer-events:all;cursor:grab}
#scrubArea.scrubbing{cursor:grabbing}
#scrubFx circle{transition:opacity .22s linear}
#waterFx{opacity:0}
#flameFx{opacity:0}
#steamFx{opacity:0}
#smokeFx{opacity:0}
#ashes{opacity:0}
#drips{opacity:0}
#puddle{opacity:0}
#charBlotches{opacity:0}
#wetBlotches{opacity:0}
#wetShine{opacity:0}
#dryDust{opacity:0;transition:opacity .2s}
#smokeFx path{animation:floatUp 2.1s infinite ease-out;transform-origin:center}
#smokeFx path:nth-child(2){animation-delay:.4s}
#smokeFx path:nth-child(3){animation-delay:1s}
#steamFx path{animation:floatUp 1.5s infinite ease-out}
#waterFx ellipse,#waterFx path{animation:fallDrop .72s infinite linear}
#waterFx ellipse:nth-child(2){animation-delay:-.27s}
#waterFx ellipse:nth-child(3){animation-delay:-.51s}
#flameFx path{animation:flicker .22s infinite alternate ease-in-out;transform-origin:344px 313px}
#flameFx path:nth-child(2){animation-delay:-.11s;transform-origin:386px 290px}

/* Both tools are detailed SVG props, not emojis or floating circles. */
#wateringCan,#lighterFx{opacity:0;transition:opacity .15s ease;pointer-events:none}
#wateringCan .can-group{animation:tipCan 1.3s ease-in-out infinite;transform-origin:187px 105px}
@keyframes tipCan{0%,100%{transform:rotate(-1deg) translateY(0)}50%{transform:rotate(2deg) translateY(-3px)}}
#waterFx .stream{stroke-dasharray:3 11;animation:rainFlow .52s linear infinite;stroke-linecap:round}
#waterFx .stream:nth-child(2n){animation-duration:.67s;animation-delay:-.17s}
#waterFx .splash{animation:splashPulse .44s ease-in-out infinite alternate;transform-origin:center}
#waterFx .splash:nth-child(2n){animation-delay:-.23s}
@keyframes rainFlow{from{stroke-dashoffset:0}to{stroke-dashoffset:-42}}
@keyframes splashPulse{from{opacity:.3;transform:scale(.85)}to{opacity:1;transform:scale(1.09)}}
#lighterFx .lighter{animation:lighterBob .7s ease-in-out infinite alternate;transform-origin:333px 494px}
#lighterFx .flameOutline{animation:flicker .2s infinite alternate ease-in-out;transform-origin:331px 448px}
#lighterFx .flameHeart{animation:flicker .16s infinite alternate ease-in-out;transform-origin:331px 448px;animation-delay:-.08s}
#flameFx .heat-wave{animation:heatDance .6s ease-in-out infinite alternate}
@keyframes heatDance{from{transform:translateY(2px);opacity:.18}to{transform:translateY(-3px);opacity:.55}}
@keyframes lighterBob{from{transform:translateY(0)}to{transform:translateY(1.5px)}}
@keyframes floatUp{0%{transform:translateY(8px) scale(.8);opacity:.2}33%{opacity:.8}100%{transform:translateY(-44px) scale(1.3);opacity:0}}
@keyframes flicker{0%{transform:scaleY(.83) skewX(-4deg)}100%{transform:scaleY(1.15) skewX(4deg)}}
@keyframes fallDrop{0%{transform:translateY(-12px);opacity:0}25%{opacity:1}100%{transform:translateY(47px);opacity:0}}
.state{position:absolute;z-index:5;left:15px;right:15px;bottom:calc(105px + env(safe-area-inset-bottom));padding:13px 15px;border-radius:17px;background:#101b14e6;border:1px solid #9aaa8b6a;box-shadow:0 9px 22px #030a055c}
.state-name{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:18px;font-weight:900;margin-bottom:5px}
.state-tag{font-size:11px;font-weight:700;background:#9ba77f23;border:1px solid #baca9880;color:#dce9bc;padding:5px 9px;white-space:nowrap;border-radius:99px}
.state-desc{font-size:12px;line-height:1.5;color:#cfd9c6}
.controls{position:absolute;z-index:7;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:11px 15px calc(15px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,#0c1710ba 12%,#0a150dee 55%)}
.tool{border:1px solid #aec4b26e;border-radius:17px;min-height:78px;display:flex;align-items:center;justify-content:center;gap:9px;font:inherit;font-size:17px;font-weight:900;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.tool span{font-size:25px}
.tool small{font-weight:500;font-size:11px;display:block;line-height:1.6;color:#e5ecda}
.tool.water{background:linear-gradient(160deg,#2e728f,#235069)}
.tool.fire{background:linear-gradient(160deg,#91532b,#68331d)}
.tool.active{filter:brightness(1.28);transform:scale(.978);border-color:#fff9}
.tool:disabled{opacity:.55;filter:grayscale(.8);cursor:default}
@media(max-height:720px){.artframe{top:20%;height:54%}.state{padding:9px 12px;bottom:calc(95px + env(safe-area-inset-bottom))}.state-name{font-size:16px}.tool{min-height:67px}.controls{padding-top:7px}}
@media(max-width:390px){.header{padding-left:12px;padding-right:12px}.toprow h1{font-size:20px}.subtitle{font-size:11px}.state{left:11px;right:11px}.controls{gap:8px;padding-left:11px;padding-right:11px}}

/* Standalone second stage: memorise an outline for one second, then draw it from memory. */
.next-stage{width:100%;margin-top:10px;padding:9px 13px;background:linear-gradient(135deg,#83a45d,#537e55);border:1px solid #cfefaa80;border-radius:12px;color:#fcffeb;font:inherit;font-size:14px;font-weight:900;min-height:40px;cursor:pointer;touch-action:manipulation}
.next-stage:active{filter:brightness(1.2)}
#memoryOverlay{position:absolute;inset:0;width:100%;height:100%;max-width:580px;margin:auto;touch-action:none;z-index:4;pointer-events:auto;overscroll-behavior:none}
#drawingSurface{pointer-events:all;cursor:crosshair}
#memoryTarget,#memoryGhost,#memoryInk,#memorySplash{pointer-events:none}
.stage2-info{position:absolute;z-index:9;left:14px;right:14px;top:calc(130px + env(safe-area-inset-top));text-align:center;padding:9px 12px;border-radius:16px;background:#14231ddf;border:1px solid #b5c7ab75;box-shadow:0 8px 20px #07140b70}
.memory-round{font-weight:900;font-size:14px;color:#f4ecd0;letter-spacing:1px}
.memory-instruction{margin-top:5px;font-size:15px;font-weight:800;color:#e3f7e1}
.scores-mini{font-size:12px;color:#b6d3be;margin-top:5px}
.stage2-result{position:absolute;z-index:10;top:calc(65% - 85px);left:50%;transform:translateX(-50%);width:min(84%,320px);background:#0c1b17eb;border:1px solid #c4d9bda0;border-radius:18px;box-shadow:0 9px 34px #020905a8;text-align:center;padding:16px 13px;pointer-events:none}
.result-title{font-size:32px;line-height:1.15;color:#fff0b5;font-weight:1000}
.result-subtitle{margin-top:6px;font-size:13px;color:#d2e6d7}
.stage2-controls{position:absolute;z-index:9;bottom:0;left:0;right:0;padding:13px 14px calc(15px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,#101a16ed 17%,#0a1310 70%)}
.stage2-tip{font-size:12px;color:#d6e9d4;text-align:center;margin-bottom:9px}
.stage2-buttons{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.stage2-buttons button{min-height:66px;border-radius:15px;font:inherit;font-weight:900;font-size:20px;touch-action:manipulation}
.redraw-btn{background:#405a4d;color:#f2f6e7;border:1px solid #9daf9f74}
.fold-btn{background:linear-gradient(145deg,#e8b969,#bb732e);color:#22190c;border:1px solid #ffe2a4}
.fold-btn:disabled{filter:grayscale(.7);opacity:.53}
@media(max-height:730px){.stage2-info{top:calc(100px + env(safe-area-inset-top));padding:6px 9px}.memory-instruction{font-size:13px}.stage2-buttons button{min-height:56px}.stage2-controls{padding-top:6px}.stage2-result{top:58%}}
@media(max-width:410px){.stage2-info{left:10px;right:10px;top:calc(128px + env(safe-area-inset-top));padding:7px 9px}.stage2-result{width:82%}}
</style>
</head>

    // Four different light/dark tones keep the quilt volumetric in every state.
    stops[0].setAttribute('stop-color',rgb(blend(color,[245,245,193],.26)));
    stops[1].setAttribute('stop-color',rgb(blend(color,[243,252,199],.08)));
    stops[2].setAttribute('stop-color',rgb(color));
    stops[3].setAttribute('stop-color',rgb(blend(color,[12,29,20],.28)));
    edgeStops[0].setAttribute('stop-color',rgb(blend(color,[15,42,29],.23)));
    edgeStops[1].setAttribute('stop-color',rgb(blend(color,[10,25,18],.55)));
    $('baseFabric').setAttribute('stroke',rgb(blend(color,[17,40,24],.46)));
    // Moist fabric loses puff volume and visibly sags over the front edge.
    const sag=clamp((moisture-30)/70,0,1);
    const stiffness=clamp((25-moisture)/25,0,1);
    const scaleY=1 + sag*.065 - stiffness*.03;
    const scaleX=1 + sag*.022 - stiffness*.008;
    blanket.setAttribute('transform',`translate(${305*(1-scaleX)} ${330*(1-scaleY)+sag*12}) scale(${scaleX} ${scaleY})`);
    $('folds').setAttribute('opacity',String(.78+stiffness*.16-sag*.23));
    $('puffLines').setAttribute('opacity',String(.92-sag*.50));
    $('dryDust').style.opacity=String(clamp((20-moisture)/16,0,1)*(1-clamp(burn/20,0,1)));
    wetBlotches.style.opacity=String(clamp((moisture-37)/35,0,.72));
    wetShine.style.opacity=String(clamp((moisture-57)/43,0,.85));
    puddle.style.opacity=String(clamp((moisture-66)/34,0,1));
    drips.style.opacity=String(clamp((moisture-68)/22,0,1));
    charBlotches.style.opacity=String(clamp((burn-11)/62,0,1));
    $('hemStroke').setAttribute('opacity',String(.66-clamp(burn/100,0,.5)));
    $('stitching').setAttribute('opacity',String(1-clamp((burn-40)/58,0,.75)));
    // Ash is drawn below the tool effects as a remaining identifiable fabric pile.
    blanket.setAttribute('opacity',String(ash?0:Math.max(.01,1-clamp((burn-87)/13,0,1))));
    ashes.style.opacity=String(ash?1:clamp((burn-87)/13,0,1));
    steamFx.style.opacity=String(action==='fire'&&!ash?clamp((moisture-12)/48,0,.95):0);
    smokeFx.style.opacity=String((burn>49&&!ash)?clamp((burn-49)/32,0,.9):(ash?.35:0));
    waterFx.style.opacity=String(action==='water'&&!ash?1:0);
    $('wateringCan').style.opacity=String(action==='water'&&!ash?1:0);
    flameFx.style.opacity=String(action==='fire'&&!ash?clamp((72-moisture)/50,.18,.82):0);
    $('lighterFx').style.opacity=String(action==='fire'&&!ash?1:0);
    // Keep even burnt quilt visually textured, never pure black.
    dirtPieces.forEach((el,i)=>{
      const threshold=4 + i*4.2;
      const vis=clamp((dirt-threshold)/18,0,1);
      el.style.opacity=String(vis);
    });
    dirtStains.forEach((el,i)=>{
      const vis=clamp((dirt-(i*6))/42,0,.95);
      el.style.opacity=String(vis);
    });
    scrubArea.classList.toggle('scrubbing', scrubbing);
    firBtn.disabled=watBtn.disabled=ash;
  }
  function svgPoint(e){
    const pt=scene.createSVGPoint();
    pt.x=e.clientX; pt.y=e.clientY;
    return pt.matrixTransform(scene.getScreenCTM().inverse());
  }
  function addScrubFx(x,y){
    const ns='http://www.w3.org/2000/svg';
    for(let i=0;i<3;i++){
      const c=document.createElementNS(ns,'circle');
      c.setAttribute('cx', x + (Math.random()*18-9));
      c.setAttribute('cy', y + (Math.random()*12-6));
      c.setAttribute('r', 4 + Math.random()*5);
      c.setAttribute('fill', 'rgba(255,255,255,.45)');
      c.setAttribute('stroke', 'rgba(220,250,255,.6)');
      c.setAttribute('stroke-width', '1.2');
      scrubFx.appendChild(c);
      setTimeout(()=>{c.style.opacity='0'; c.setAttribute('transform','translate(0 -8)');},20);
      setTimeout(()=>c.remove(),280);
    }
  }
  function scrubMove(e){
    if(stage!==1 || !scrubbing || ash) return;
    const pt=svgPoint(e);
    if(lastScrubPoint){
      const dx=pt.x-lastScrubPoint.x, dy=pt.y-lastScrubPoint.y;
      const dist=Math.hypot(dx,dy);
      scrubAccum += dist;
      if(moisture>=38 && dirt>0 && dist>0){
        dirt = clamp(dirt - dist*0.0082, 0, 100);
        addScrubFx(pt.x, pt.y);
      }
    }
    lastScrubPoint=pt;
    update();
    e.preventDefault();
  }
  scrubArea.addEventListener('pointerdown',e=>{
    if(stage!==1 || ash) return;
    if(action) setAction(null);
    scrubbing=true; lastScrubPoint=svgPoint(e);
    try{scrubArea.setPointerCapture(e.pointerId);}catch(_){ }
    e.preventDefault();
    update();
  });
  scrubArea.addEventListener('pointermove',scrubMove);
  for(const evt of ['pointerup','pointercancel','lostpointercapture']){
    scrubArea.addEventListener(evt,()=>{scrubbing=false; lastScrubPoint=null; update();});
  }
  function setAction(which){
    if((ash || stage!==1) && which)return;
    action=which;
    watBtn.classList.toggle('active',which==='water'); firBtn.classList.toggle('active',which==='fire');
    update();
  }
  function bind(btn,which){
    let pressedAt=0;
    btn.addEventListener('pointerdown',e=>{
      if(ash || stage!==1)return;
      e.preventDefault();
      pressedAt=performance.now();
      try{btn.setPointerCapture(e.pointerId);}catch(_){}
      setAction(which);
    });
    for(const eventName of ['pointerup','pointercancel','lostpointercapture']){
      btn.addEventListener(eventName,()=>{if(action===which)setAction(null);});
    }
    // A quick tap still changes the blanket; a long hold won't get an extra boost on release.
    btn.addEventListener('click',()=>{
      if(ash || stage!==1)return;
      if(performance.now()-pressedAt<170){step(which,.25);update();}
    });
  }
  function step(which,dt){
    if(ash || stage!==1)return;
    if(which==='water'){
      moisture=clamp(moisture+dt*26);
      // Moisture stops active combustion, but char marks do not vanish magically.
      if(burn>0)burn=clamp(burn-dt*2,0,100);
    }else if(which==='fire'){
      moisture=clamp(moisture-dt*29);
      if(moisture<20) burn=clamp(burn+dt*(moisture<6?29:13));
    }
    if(burn>=99.7){burn=100;ash=true;setAction(null);}
  }
  bind(watBtn,'water');bind(firBtn,'fire');
  window.addEventListener('blur',()=>setAction(null));
  function rerollDirt(){ dirt=Math.round(72 + Math.random()*28); }
  $('reset').addEventListener('click',()=>{leaveStage2();moisture=32;burn=0;ash=false;rerollDirt();scrubbing=false;lastScrubPoint=null;setAction(null);update();});
  function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;if(action)step(action,dt);if(now-lastRender>60){update();lastRender=now;} requestAnimationFrame(frame);}
  // Stage 2: one-second memory challenge; three independently generated outlines.
  const overlay=$('memoryOverlay'),memoryTarget=$('memoryTarget'),memoryGhost=$('memoryGhost'),memoryInk=$('memoryInk'),memorySplash=$('memorySplash');
  const roundLabel=$('roundLabel'),memoryInstruction=$('memoryInstruction'),scoresMini=$('scoresMini');
  const stage2Tip=$('stage2Tip'),stage2Result=$('stage2Result'),stage2ResultTitle=$('stage2ResultTitle'),stage2ResultSubtitle=$('stage2ResultSubtitle');
  const redrawBtn=$('redrawBtn'),foldBtn=$('foldBtn');
  let round=0,mode='idle',roundScores=[],targetPoints=[],drawPoints=[],lastDrawPointer=null,previewTimer=null,feedbackTimer=null;
  const C={x:320,y:329}, TAU=Math.PI*2;
  // SVG nodes do not reliably implement HTMLElement.hidden on mobile Safari.
  const svgShow=(el,visible)=>{if(visible)el.removeAttribute('hidden');else el.setAttribute('hidden','');};
  function clearStageTimers(){if(previewTimer!==null)clearTimeout(previewTimer);if(feedbackTimer!==null)clearTimeout(feedbackTimer);previewTimer=feedbackTimer=null;}
  function buildOutline(n){
    // Round difficulty grows: larger number of bends in the enclosed white outline.
    const templates=[
      [{a:0,r:1},{a:.15,r:.77},{a:.31,r:1.14},{a:.49,r:.86},{a:.64,r:1.06},{a:.84,r:.81}],
      [{a:0,r:1.03},{a:.13,r:.67},{a:.27,r:1.12},{a:.42,r:.80},{a:.57,r:1.07},{a:.72,r:.72},{a:.89,r:1.12}],
      [{a:0,r:1.06},{a:.10,r:.76},{a:.22,r:1.13},{a:.34,r:.80},{a:.47,r:1.13},{a:.60,r:.73},{a:.73,r:1.11},{a:.86,r:.78},{a:.96,r:1.03}]
    ];
    const template=templates[n];
    const turn=Math.random()*TAU;
    return template.map(v=>{
      const a=v.a*TAU+turn;
      const ratio=v.r*(.89+Math.random()*.21);
      return {x:C.x+Math.cos(a)*135*ratio,y:C.y+Math.sin(a)*71*ratio};
    });
  }
  function polyPath(points,close){
    if(!points.length)return '';
    return 'M'+points.map((p,i)=>(i?'L':'')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ') +(close?' Z':'');
  }
  function svgDrawPoint(e){
    const p=overlay.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
    const t=overlay.getScreenCTM();
    return t?p.matrixTransform(t.inverse()):{x:p.x,y:p.y};
  }
  function showScoreSummary(){
    const avg=Math.round(roundScores.reduce((a,b)=>a+b,0)/3);
    mode='done';lastDrawPointer=null;
    svgShow(memoryTarget,false);svgShow(memoryGhost,false);svgShow(memoryInk,false);
    memorySplash.textContent='挑戰完成！';
    roundLabel.textContent='三次開折結束';
    memoryInstruction.textContent='三次的貼合分數已經結算';
    scoresMini.textContent=roundScores.map((v,i)=>`第${i+1}次 ${v}分`).join('　');
    stage2Tip.textContent='想重新挑戰，可以再抽三個新圖形。';
    stage2Result.hidden=false;
    stage2ResultTitle.textContent=`平均 ${avg} 分`;
    stage2ResultSubtitle.textContent=roundScores.map((v,i)=>`第 ${i+1} 次 ${v} 分`).join('　');
    redrawBtn.textContent='回第一階段';
    redrawBtn.disabled=false;
    foldBtn.disabled=false;foldBtn.textContent='重新挑戰';
  }
  function startRound(){
    clearStageTimers();
    if(stage!==2)return;
    if(round>=3){showScoreSummary();return;}
    mode='preview';drawPoints=[];lastDrawPointer=null;
    targetPoints=buildOutline(round);
    memoryTarget.setAttribute('d',polyPath(targetPoints,true));
    svgShow(memoryTarget,true);svgShow(memoryGhost,false);svgShow(memoryInk,true);memoryInk.setAttribute('d','');
    stage2Result.hidden=true;
    memorySplash.textContent='記住這條白線！';
    roundLabel.textContent=`第 ${round+1} / 3 題`;
    memoryInstruction.textContent='白線只有 1 秒鐘！';
    scoresMini.textContent=roundScores.length?roundScores.map((v,i)=>`第${i+1}次 ${v}分`).join('　'):'目前尚未計分';
    stage2Tip.textContent='記住形狀！線條消失後就能開始畫';
    redrawBtn.disabled=true;foldBtn.disabled=true;foldBtn.textContent='開折';
    previewTimer=setTimeout(()=>{
      if(stage!==2 || mode!=='preview')return;
      previewTimer=null;mode='draw';
      svgShow(memoryTarget,false);memorySplash.textContent='輪到你了！';
      memoryInstruction.textContent='憑記憶畫出剛才的封閉線條';
      stage2Tip.textContent='直接在棉被上畫線，畫好按「開折」';
      redrawBtn.disabled=false;
    },1000);
  }
  function startStage2(){
    stage=2;setAction(null);scrubbing=false;
    round=0;roundScores=[];drawPoints=[];clearStageTimers();
    $('stage1Meters').hidden=true;$('stage1State').hidden=true;$('stage1Controls').hidden=true;
    $('stageSubtitle').textContent='第二階段｜白線記憶開折（共 3 次）';
    svgShow(overlay,true);$('stage2Info').hidden=false;$('stage2Controls').hidden=false;
    redrawBtn.textContent='重畫';
    startRound();
  }
  function leaveStage2(){
    clearStageTimers();stage=1;mode='idle';lastDrawPointer=null;
    svgShow(overlay,false);$('stage2Info').hidden=true;$('stage2Controls').hidden=true;stage2Result.hidden=true;
    $('stage1Meters').hidden=false;$('stage1State').hidden=false;$('stage1Controls').hidden=false;
    $('stageSubtitle').textContent='第一階段｜棉被乾濕度、焦化與刷洗';
  }
  function length(points,closed){
    let L=0;for(let i=1;i<points.length;i++)L+=Math.hypot(points[i].x-points[i-1].x,points[i].y-points[i-1].y);
    if(closed&&points.length>=3)L+=Math.hypot(points[0].x-points.at(-1).x,points[0].y-points.at(-1).y);
    return L;
  }
  function samplePolyline(points,closed,n=96){
    if(points.length<2)return [];
    const segments=[];let total=0;
    const end=closed?points.length:points.length-1;
    for(let i=0;i<end;i++){
      const a=points[i],b=points[(i+1)%points.length],L=Math.hypot(a.x-b.x,a.y-b.y);
      if(L<.01)continue;segments.push({a,b,L,begin:total});total+=L;
    }
    if(!total)return [];
    const out=[];let segIndex=0;
    for(let i=0;i<n;i++){
      const dist=total*(closed?i/n:i/(n-1));
      while(segIndex<segments.length-1&&dist>segments[segIndex].begin+segments[segIndex].L)segIndex++;
      const s=segments[segIndex],r=clamp((dist-s.begin)/s.L,0,1);
      out.push({x:s.a.x+(s.b.x-s.a.x)*r,y:s.a.y+(s.b.y-s.a.y)*r});
    }
    return out;
  }
  function nearestDistance(p,points){
    let d=1e9;for(const q of points){const m=(p.x-q.x)**2+(p.y-q.y)**2;if(m<d)d=m;}
    return Math.sqrt(d);
  }
  function similarity(){
    if(drawPoints.length<8||length(drawPoints,false)<35)return 0;
    const T=samplePolyline(targetPoints,true),U=samplePolyline(drawPoints,false);
    if(!T.length||!U.length)return 0;
    const tDist=T.map(p=>nearestDistance(p,U)),uDist=U.map(p=>nearestDistance(p,T));
    const mean=(tDist.reduce((a,b)=>a+b,0)/T.length + uDist.reduce((a,b)=>a+b,0)/U.length)/2;
    const coverage=tDist.filter(d=>d<25).length/T.length;
    const detail=clamp(1-mean/70,0,1);
    const tLen=length(targetPoints,true),uLen=length(drawPoints,false);
    const lenQuality=Math.exp(-1.55*Math.abs(Math.log(Math.max(1,uLen)/tLen)));
    const closure=clamp(1-Math.hypot(drawPoints[0].x-drawPoints.at(-1).x,drawPoints[0].y-drawPoints.at(-1).y)/100,0,1);
    return Math.round(clamp((.62*detail+.23*coverage+.10*lenQuality+.05*closure)*100,0,100));
  }
  $('nextStageBtn').addEventListener('click',startStage2);
  overlay.addEventListener('pointerdown',e=>{
    if(stage!==2||mode!=='draw'||e.button>0)return;
    drawPoints=[svgDrawPoint(e)];lastDrawPointer=e.pointerId;
    memoryInk.setAttribute('d',polyPath(drawPoints,false));
    memorySplash.textContent='';
    foldBtn.disabled=true;
    try{overlay.setPointerCapture(e.pointerId)}catch(_){}
    e.preventDefault();
  });
  overlay.addEventListener('pointermove',e=>{
    if(stage!==2||mode!=='draw'||lastDrawPointer!==e.pointerId)return;
    const p=svgDrawPoint(e),lastPoint=drawPoints.at(-1);
    if(!lastPoint||Math.hypot(p.x-lastPoint.x,p.y-lastPoint.y)>2){
      drawPoints.push(p);memoryInk.setAttribute('d',polyPath(drawPoints,false));
    }
    foldBtn.disabled=drawPoints.length<5;
    e.preventDefault();
  });
  const endStroke=e=>{if(lastDrawPointer!==e.pointerId)return;lastDrawPointer=null;foldBtn.disabled=drawPoints.length<5;};
  overlay.addEventListener('pointerup',endStroke);overlay.addEventListener('pointercancel',endStroke);
  overlay.addEventListener('lostpointercapture',()=>{lastDrawPointer=null;});
  redrawBtn.addEventListener('click',()=>{
    if(stage!==2)return;
    if(mode==='done'){leaveStage2();return;}
    if(mode!=='draw')return;
    drawPoints=[];memoryInk.setAttribute('d','');memorySplash.textContent='';foldBtn.disabled=true;
  });
  foldBtn.addEventListener('click',()=>{
    if(stage!==2)return;
    if(mode==='done'){round=0;roundScores=[];redrawBtn.textContent='重畫';startRound();return;}
    if(mode!=='draw'||foldBtn.disabled)return;
    const score=similarity();roundScores.push(score);mode='feedback';lastDrawPointer=null;
    svgShow(memoryTarget,false);memoryGhost.setAttribute('d',polyPath(targetPoints,true));svgShow(memoryGhost,true);
    stage2ResultTitle.textContent=`${score} 分`;
    stage2ResultSubtitle.textContent=round===2?'三次開折完成！':'白色虛線是正確形狀；青色是你畫的';
    stage2Result.hidden=false;
    memorySplash.textContent='';
    memoryInstruction.textContent=round===2?'正在結算三次分數…':'這回合的貼合度';
    scoresMini.textContent=roundScores.map((v,i)=>`第${i+1}次 ${v}分`).join('　');
    stage2Tip.textContent='對照正確白線與你畫出的線條';
    foldBtn.disabled=true;redrawBtn.disabled=true;
    feedbackTimer=setTimeout(()=>{feedbackTimer=null;round++;startRound();},1900);
  });
  window.__blanketStageDebug=()=>({stage,round,mode,roundScores:[...roundScores],previewVisible:!memoryTarget.hasAttribute('hidden'),drawPoints:drawPoints.length,moisture,burn,dirt,ash,action,scrubbing,state:state()[0],fabric:stops[2].getAttribute('stop-color')});
  rerollDirt();
  update();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
